<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据服务平台 - 目录编制</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .step-active { background: #1c7ffd; color: white; }
        .step-inactive { background: #fff; color: #909399; border: 1px solid #dcdfe6; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-[#f0f2f5] text-[14px] text-gray-700">
    <!-- 顶部导航栏 -->
    <header class="h-14 bg-[#1c7ffd] flex justify-between items-center px-6 text-white shrink-0 shadow-sm z-10">
        <div class="flex items-center gap-2 cursor-pointer hover:text-gray-200 transition-colors" onclick="window.location.href='index.html'">
            <i class="fa-solid fa-cubes-stacked text-2xl"></i>
            <span class="text-lg font-medium tracking-wider ml-1">数据服务平台</span>
        </div>
        <div class="flex items-center gap-6">
            <div class="relative cursor-pointer hover:text-gray-200 transition-colors" onclick="window.location.href='my_messages.html'">
                <i class="fa-regular fa-bell text-xl"></i>
                <span class="absolute -top-1.5 -right-2 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border border-[#1c7ffd] leading-none">20</span>
            </div>
            <div class="flex items-center gap-2 cursor-pointer hover:text-gray-200 transition-colors">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=yiyun&backgroundColor=b6e3f4" alt="avatar" class="w-8 h-8 rounded-full border border-blue-300 bg-white">
                <span>yiyun</span>
            </div>
        </div>
    </header>

    <!-- 主体内容 -->
    <div class="flex-1 flex overflow-hidden">
        <!-- 左侧导航 -->
        <aside class="w-[220px] bg-white border-r border-gray-200 shrink-0 overflow-y-auto">
            <div id="developer-side-nav" class="py-4"></div>
        </aside>

        <script src="./developer_nav.js?v=20260831b"></script>

        <!-- 右侧内容区 -->
        <main class="flex-1 flex flex-col overflow-hidden relative">
            <div id="developer-top-nav" class="h-[52px] bg-white border-b border-gray-200 px-6 flex items-center gap-2 shrink-0 overflow-x-auto"></div>

            <div class="px-6 py-3 bg-white border-b border-gray-100 flex items-center shrink-0">
                <a href="catalog_manage.html?nav=resource-catalog" class="text-[#1c7ffd] hover:opacity-80 transition-colors flex items-center gap-1 font-medium text-[15px]">
                    <i class="fa-solid fa-arrow-rotate-left"></i> 返回列表
                </a>
            </div>

            <div id="content-scroll" class="flex-1 p-6 pb-[88px] overflow-y-auto relative">
                <div class="bg-white rounded-lg shadow-sm border border-gray-100">
                    <!-- 步骤导航 -->
                    <div class="py-8 px-10">
                        <div class="flex items-center justify-between relative">
                            <!-- 连线 -->
                            <div class="absolute top-1/2 left-0 right-0 h-0.5 bg-gray-200 -translate-y-1/2" id="step-progress-bar"></div>
                            
                            <!-- 步骤1 -->
                            <div class="relative z-10 flex flex-col items-center">
                                <div class="w-10 h-10 rounded-full bg-[#1c7ffd] text-white flex items-center justify-center font-bold text-base transition-all" id="step-1-icon">1</div>
                                <span class="mt-3 font-medium text-[#303133] transition-colors" id="step-1-text">数据资源目录维护</span>
                            </div>
                            
                            <!-- 步骤2 -->
                            <div class="relative z-10 flex flex-col items-center">
                                <div class="w-10 h-10 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center font-bold text-base transition-all" id="step-2-icon">2</div>
                                <span class="mt-3 font-medium text-[#909399] transition-colors" id="step-2-text">信息项维护</span>
                            </div>
                        </div>
                    </div>

                    <div id="step-1-content" class="px-10 pb-8 space-y-8">
                        <!-- 基本信息 -->
                        <div>
                            <div class="flex items-center justify-between mb-6">
                                <h3 class="text-[16px] font-bold text-[#303133] flex items-center">
                                    <span class="w-1 h-4 bg-[#1c7ffd] rounded-full mr-2"></span>
                                    基本信息
                                </h3>
                                <button onclick="openSmartFillModal()" class="px-4 py-1.5 bg-gradient-to-r from-[#1c7ffd] to-[#00d9a6] text-white rounded-md text-sm hover:opacity-90 transition-opacity flex items-center gap-1.5">
                                    <i class="fa-solid fa-wand-magic-sparkles"></i> 智能填充
                                </button>
                            </div>
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">
                                        <span class="text-red-500 mr-1">*</span>数据资源目录名称
                                    </label>
                                    <input type="text" id="catalog-name" placeholder="以概况政务数据资源目录内容的标题和“信息”字样组成。建议包含数据资源目录覆盖范围。" 
                                        class="w-full h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all">
                                </div>
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">
                                        <span class="text-red-500 mr-1">*</span>数据资源目录摘要
                                    </label>
                                    <textarea id="catalog-summary" rows="3" placeholder="对资源内容进行概要说明的文字。与目录名称相对应。包含挂载的数据资源目录的起始时间。" 
                                        class="w-full px-3 py-2 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all resize-none"></textarea>
                                </div>
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">
                                        <span class="text-red-500 mr-1">*</span>所属领域
                                    </label>
                                    <select id="domain" class="w-full h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all bg-white">
                                        <option>请选择</option>
                                        <option>经济建设</option>
                                        <option>教育科技</option>
                                        <option>社会保障</option>
                                        <option>医疗卫生</option>
                                        <option>城市建设</option>
                                        <option>公共安全</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">主题资源分类</label>
                                    <select id="theme-category" class="w-full h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all bg-white">
                                        <option>请选择</option>
                                        <option>人口基础信息</option>
                                        <option>法人基础信息</option>
                                        <option>空间地理基础信息</option>
                                        <option>社会信用基础信息</option>
                                        <option>电子证照基础信息</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[#606266] font-medium mb-3">
                                        <span class="text-red-500 mr-1">*</span>是否包含电子证照
                                    </label>
                                    <div class="flex items-center gap-6">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="has-license" value="是" class="text-[#1c7ffd] focus:ring-[#1c7ffd]">
                                            <span class="text-[#606266]">是</span>
                                        </label>
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="has-license" value="否" checked class="text-[#1c7ffd] focus:ring-[#1c7ffd]">
                                            <span class="text-[#606266]">否</span>
                                        </label>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">
                                        <span class="text-red-500 mr-1">*</span>应用场景
                                    </label>
                                    <select id="application-scene" class="w-full h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all bg-white">
                                        <option>请选择</option>
                                        <option>政务服务</option>
                                        <option>市场监管</option>
                                        <option>公共安全</option>
                                        <option>城市治理</option>
                                        <option>社会服务</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">
                                        <span class="text-red-500 mr-1">*</span>来源系统
                                    </label>
                                    <div class="flex items-center">
                                        <select id="source-system" class="flex-1 h-[36px] px-3 border border-gray-200 rounded-l-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all bg-white">
                                            <option>请选择</option>
                                            <option>政务数据平台</option>
                                            <option>工商登记系统</option>
                                            <option>税务管理系统</option>
                                            <option>公安人口系统</option>
                                        </select>
                                        <button class="w-10 h-[36px] border border-l-0 border-gray-200 rounded-r-md text-[#1c7ffd] hover:bg-blue-50 transition-colors">
                                            <i class="fa-solid fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">数据所属事项名称</label>
                                    <select id="matter-name" class="w-full h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all bg-white">
                                        <option>请选择</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">
                                        <span class="text-red-500 mr-1">*</span>业务更新周期
                                    </label>
                                    <select id="business-cycle" class="w-full h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all bg-white">
                                        <option>请选择</option>
                                        <option>实时</option>
                                        <option>每日</option>
                                        <option>每周</option>
                                        <option>每月</option>
                                        <option>每季度</option>
                                        <option>每年</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">
                                        <span class="text-red-500 mr-1">*</span>数据更新周期
                                    </label>
                                    <select id="data-cycle" class="w-full h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all bg-white">
                                        <option>请选择</option>
                                        <option>实时</option>
                                        <option>每日</option>
                                        <option>每周</option>
                                        <option>每月</option>
                                        <option>每季度</option>
                                        <option>每年</option>
                                    </select>
                                </div>
                                <div class="col-span-2">
                                    <label class="block text-[#606266] font-medium mb-2">备注</label>
                                    <textarea id="remark" rows="2" placeholder="其他需说明的相关信息。" 
                                        class="w-full px-3 py-2 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all resize-none"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- 数据资源目录格式 -->
                        <div>
                            <h3 class="text-[16px] font-bold text-[#303133] mb-6 flex items-center">
                                <span class="w-1 h-4 bg-[#1c7ffd] rounded-full mr-2"></span>
                                数据资源目录格式
                            </h3>
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">
                                        <span class="text-red-500 mr-1">*</span>数据资源目录格式分类
                                    </label>
                                    <select id="format-category" class="w-full h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all bg-white">
                                        <option>请选择</option>
                                        <option>数据库</option>
                                        <option>文件</option>
                                        <option>API</option>
                                        <option>流媒体</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">
                                        <span class="text-red-500 mr-1">*</span>数据资源目录格式类型
                                    </label>
                                    <select id="format-type" class="w-full h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all bg-white">
                                        <option>请选择</option>
                                        <option>MySQL</option>
                                        <option>PostgreSQL</option>
                                        <option>SQL Server</option>
                                        <option>CSV</option>
                                        <option>JSON</option>
                                        <option>REST API</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- 共享属性 -->
                        <div>
                            <h3 class="text-[16px] font-bold text-[#303133] mb-6 flex items-center">
                                <span class="w-1 h-4 bg-[#1c7ffd] rounded-full mr-2"></span>
                                共享属性
                            </h3>
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-[#606266] font-medium mb-3">
                                        <span class="text-red-500 mr-1">*</span>数据资源目录共享类型
                                    </label>
                                    <div class="flex items-center gap-6">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="share-type" value="无条件共享" checked class="text-[#1c7ffd] focus:ring-[#1c7ffd]">
                                            <span class="text-[#606266]">无条件共享</span>
                                        </label>
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="share-type" value="有条件共享" class="text-[#1c7ffd] focus:ring-[#1c7ffd]">
                                            <span class="text-[#606266]">有条件共享</span>
                                        </label>
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="share-type" value="不予共享" class="text-[#1c7ffd] focus:ring-[#1c7ffd]">
                                            <span class="text-[#606266]">不予共享</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-6">
                                <label class="block text-[#606266] font-medium mb-2">
                                    <span class="text-red-500 mr-1">*</span>数据资源目录共享条件
                                </label>
                                <textarea id="share-condition" rows="3" placeholder="对无条件共享的政务目录，标明使用要求，包括作为行政依据、工作参考，用于数据校核、业务协同等。" 
                                    class="w-full px-3 py-2 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all resize-none"></textarea>
                            </div>
                        </div>

                        <!-- 开放属性 -->
                        <div>
                            <h3 class="text-[16px] font-bold text-[#303133] mb-6 flex items-center">
                                <span class="w-1 h-4 bg-[#1c7ffd] rounded-full mr-2"></span>
                                开放属性
                            </h3>
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-[#606266] font-medium mb-3">
                                        <span class="text-red-500 mr-1">*</span>数据资源目录开放类型
                                    </label>
                                    <div class="flex items-center gap-6">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="open-type" value="无条件开放" class="text-[#1c7ffd] focus:ring-[#1c7ffd]">
                                            <span class="text-[#606266]">无条件开放</span>
                                        </label>
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="open-type" value="有条件开放" class="text-[#1c7ffd] focus:ring-[#1c7ffd]">
                                            <span class="text-[#606266]">有条件开放</span>
                                        </label>
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="open-type" value="不予开放" checked class="text-[#1c7ffd] focus:ring-[#1c7ffd]">
                                            <span class="text-[#606266]">不予开放</span>
                                        </label>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-[#606266] font-medium mb-3">
                                        <span class="text-red-500 mr-1">*</span>是否通过隐私计算提供
                                    </label>
                                    <div class="flex items-center gap-6">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="privacy-compute" value="是" class="text-[#1c7ffd] focus:ring-[#1c7ffd]">
                                            <span class="text-[#606266]">是</span>
                                        </label>
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name="privacy-compute" value="否" checked class="text-[#1c7ffd] focus:ring-[#1c7ffd]">
                                            <span class="text-[#606266]">否</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 数据资源目录提供方信息 -->
                        <div>
                            <h3 class="text-[16px] font-bold text-[#303133] mb-6 flex items-center">
                                <span class="w-1 h-4 bg-[#1c7ffd] rounded-full mr-2"></span>
                                数据资源目录提供方信息
                            </h3>
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">
                                        <span class="text-red-500 mr-1">*</span>目录提供方
                                    </label>
                                    <input type="text" id="provider" value="大数据局" readonly 
                                        class="w-full h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none bg-gray-50">
                                </div>
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">提供方内设机构</label>
                                    <input type="text" id="provider-dept" placeholder="请输入" 
                                        class="w-full h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all">
                                </div>
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">
                                        <span class="text-red-500 mr-1">*</span>联系人
                                    </label>
                                    <div class="flex items-center">
                                        <input type="text" id="contact" value="潍坊市大数据局" 
                                            class="flex-1 h-[36px] px-3 border border-gray-200 rounded-l-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all">
                                        <button class="w-10 h-[36px] border border-l-0 border-gray-200 rounded-r-md text-[#909399] hover:text-red-500 hover:bg-red-50 transition-colors">
                                            <i class="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-[#606266] font-medium mb-2">
                                        <span class="text-red-500 mr-1">*</span>联系电话
                                    </label>
                                    <div class="flex items-center">
                                        <input type="text" id="contact-phone" value="15589779987" 
                                            class="flex-1 h-[36px] px-3 border border-gray-200 rounded-l-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all">
                                        <button class="w-10 h-[36px] border border-l-0 border-gray-200 rounded-r-md text-[#909399] hover:text-red-500 hover:bg-red-50 transition-colors">
                                            <i class="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 步骤2：信息项维护 -->
                    <div id="step-2-content" class="px-10 pb-8 space-y-6 hidden">
                        <!-- 操作按钮区 -->
                        <div class="flex justify-end items-center gap-3">
                            <button class="px-4 py-2 bg-gray-200 text-gray-400 rounded-md text-sm cursor-not-allowed" disabled>
                                <i class="fa-solid fa-plus text-xs"></i> 添加信息项
                            </button>
                            <button class="px-4 py-2 border border-gray-200 text-[#606266] rounded-md text-sm hover:bg-gray-50 transition-colors flex items-center gap-1">
                                <i class="fa-solid fa-trash text-xs"></i> 批量删除
                            </button>
                        </div>

                        <!-- 信息项表格 -->
                        <div class="overflow-x-auto">
                            <table class="w-full text-center text-[13px] text-[#606266] border-collapse">
                                <thead class="bg-[#f8f8f9] text-[#909399] font-medium sticky top-0">
                                    <tr>
                                        <th class="py-3 px-3 font-medium border-b border-gray-100 w-10">
                                            <input type="checkbox" class="w-4 h-4 text-[#1c7ffd] rounded">
                                        </th>
                                        <th class="py-3 px-3 font-medium border-b border-gray-100 w-16">序号</th>
                                        <th class="py-3 px-3 font-medium border-b border-gray-100">信息项名称</th>
                                        <th class="py-3 px-3 font-medium border-b border-gray-100">共享类型</th>
                                        <th class="py-3 px-3 font-medium border-b border-gray-100">共享条件</th>
                                        <th class="py-3 px-3 font-medium border-b border-gray-100">开放类型</th>
                                        <th class="py-3 px-3 font-medium border-b border-gray-100">开放条件</th>
                                        <th class="py-3 px-3 font-medium border-b border-gray-100">是否开放脱敏</th>
                                        <th class="py-3 px-3 font-medium border-b border-gray-100">脱敏规则</th>
                                        <th class="py-3 px-3 font-medium border-b border-gray-100">信息项类型</th>
                                        <th class="py-3 px-3 font-medium border-b border-gray-100">信息项长度</th>
                                        <th class="py-3 px-3 font-medium border-b border-gray-100">敏感级别</th>
                                        <th class="py-3 px-3 font-medium border-b border-gray-100">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="info-items-body">
                                    <tr>
                                        <td colspan="13" class="py-10 text-[#909399]">
                                            <div class="flex flex-col items-center gap-2">
                                                <i class="fa-solid fa-folder-open text-3xl opacity-50"></i>
                                                <span>暂无数据，请添加信息项或使用快速填充</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 h-[52px] px-6 flex items-center justify-center gap-3 bg-white border border-gray-200 rounded-lg shadow-lg z-20">
                <button class="px-6 py-1.5 border border-gray-300 rounded text-[#606266] hover:text-[#1c7ffd] hover:border-[#1c7ffd] transition-colors text-sm bg-white">暂存</button>
                <button id="btn-prev" onclick="goToStep(1)" class="px-6 py-1.5 border border-gray-300 rounded text-[#606266] hover:text-[#1c7ffd] hover:border-[#1c7ffd] transition-colors text-sm bg-white hidden">上一步</button>
                <button id="btn-next" onclick="goToStep(2)" class="px-6 py-1.5 bg-[#1c7ffd] text-white rounded hover:bg-blue-500 transition-colors text-sm">下一步</button>
                <button id="btn-submit" onclick="submitForm()" class="px-6 py-1.5 bg-[#1c7ffd] text-white rounded hover:bg-blue-500 transition-colors text-sm hidden">提交</button>
            </div>
        </main>
    </div>

    <!-- 智能填充弹窗 -->
    <div id="smart-fill-overlay" class="fixed inset-0 bg-black/30 z-[80] opacity-0 invisible transition-all duration-300" onclick="closeSmartFillModal()"></div>
    <div id="smart-fill-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[560px] bg-white z-[90] rounded-lg shadow-2xl opacity-0 invisible transition-all duration-300">
        <div class="h-12 flex items-center justify-between px-5 border-b border-gray-100">
            <h3 class="font-semibold text-base text-[#303133]">智能填充</h3>
            <button onclick="closeSmartFillModal()" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-[#909399] transition-colors">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div class="px-5 pt-4">
            <div class="flex items-center gap-2 px-4 py-3 bg-[#fffbe6] border border-[#ffe58f] rounded-lg">
                <i class="fa-solid fa-lightbulb text-[#e6a23c]"></i>
                <span id="fill-tip" class="text-sm text-[#d4a76a]">上传文件或输入描述，系统将智能解析并自动填充目录基本信息</span>
            </div>
        </div>
        <!-- Tab 切换 -->
        <div class="px-5 pt-4">
            <div class="flex border-b border-gray-200">
                <button id="fill-tab-desc" onclick="switchFillTab('desc')" class="px-5 py-2.5 text-sm font-medium border-b-2 border-[#1c7ffd] text-[#1c7ffd] -mb-px transition-colors">描述</button>
                <button id="fill-tab-upload" onclick="switchFillTab('upload')" class="px-5 py-2.5 text-sm font-medium border-b-2 border-transparent text-[#606266] hover:text-[#1c7ffd] transition-colors">上传文件</button>
            </div>
        </div>
        <div class="p-5 space-y-5">
            <!-- 描述 Tab -->
            <div id="fill-view-desc">
                <label class="block text-sm text-[#606266] mb-2">输入目录描述：</label>
                <textarea id="smart-fill-input" rows="5" placeholder="例如：企业工商登记信息，包含企业名称、统一社会信用代码、注册地址、经营范围、法定代表人等字段" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#1c7ffd] text-[#303133] resize-none"></textarea>
            </div>
            <!-- 上传文件 Tab -->
            <div id="fill-view-upload" class="hidden">
                <div class="border border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-[#1c7ffd] transition-colors cursor-pointer" onclick="document.getElementById('file-upload').click()">
                    <input type="file" id="file-upload" class="hidden" accept=".xlsx,.xls,.csv,.doc,.docx,.pdf,.json" onchange="handleFileUpload(this)">
                    <i class="fa-solid fa-upload text-3xl text-[#c0c4cc] mb-3"></i>
                    <div class="text-sm text-[#909399]">点击或拖拽文件到此处上传</div>
                    <div class="text-xs text-[#c0c4cc] mt-1">支持 .xlsx .xls .csv .doc .docx .pdf .json 格式</div>
                </div>
                <div id="uploaded-file-info" class="mt-2 text-sm text-[#606266] hidden"></div>
            </div>

            <div id="smart-fill-progress" class="hidden">
                <div class="flex items-center gap-3 mb-3">
                    <div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">
                        <div id="smart-fill-progress-bar" class="h-full bg-gradient-to-r from-[#1c7ffd] to-[#00d9a6] rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                    <span id="smart-fill-progress-text" class="text-sm text-[#606266] w-16 text-right">0%</span>
                </div>
                <div class="space-y-2">
                    <div class="flex items-center gap-2 text-sm">
                        <span class="w-5 h-5 rounded-full border border-gray-300 flex items-center justify-center text-xs" id="fill-step-1-icon">1</span>
                        <span id="fill-step-1-text" class="text-[#909399]">正在解析输入内容...</span>
                    </div>
                    <div class="flex items-center gap-2 text-sm">
                        <span class="w-5 h-5 rounded-full border border-gray-300 flex items-center justify-center text-xs" id="fill-step-2-icon">2</span>
                        <span id="fill-step-2-text" class="text-[#909399]">正在分析目录信息...</span>
                    </div>
                    <div class="flex items-center gap-2 text-sm">
                        <span class="w-5 h-5 rounded-full border border-gray-300 flex items-center justify-center text-xs" id="fill-step-3-icon">3</span>
                        <span id="fill-step-3-text" class="text-[#909399]">正在智能填充表单...</span>
                    </div>
                </div>
            </div>

            <div class="flex gap-3" id="smart-fill-buttons">
                <button onclick="closeSmartFillModal()" class="flex-1 px-5 py-2 border border-gray-200 text-[#606266] rounded-md text-sm hover:bg-gray-50 transition-colors">
                    取消
                </button>
                <button onclick="doSmartFill()" class="flex-1 px-5 py-2 bg-gradient-to-r from-[#1c7ffd] to-[#00d9a6] text-white rounded-md text-sm hover:opacity-90 transition-opacity flex items-center justify-center gap-1">
                    <i class="fa-solid fa-brain"></i>
                    开始智能填充
                </button>
            </div>
        </div>
    </div>

    <script>
        // 智能填充是否已填充过（用于二次填充覆盖提示）
        let smartFillFilled = false;
        let currentFillTab = 'desc';

        // 智能填充弹窗 Tab 切换
        function switchFillTab(tab) {
            currentFillTab = tab;
            const descTab = document.getElementById('fill-tab-desc');
            const uploadTab = document.getElementById('fill-tab-upload');
            const descView = document.getElementById('fill-view-desc');
            const uploadView = document.getElementById('fill-view-upload');
            const isDesc = tab === 'desc';
            descTab.className = 'px-5 py-2.5 text-sm font-medium border-b-2 ' + (isDesc ? 'border-[#1c7ffd] text-[#1c7ffd] -mb-px' : 'border-transparent text-[#606266] hover:text-[#1c7ffd]') + ' transition-colors';
            uploadTab.className = 'px-5 py-2.5 text-sm font-medium border-b-2 ' + (!isDesc ? 'border-[#1c7ffd] text-[#1c7ffd] -mb-px' : 'border-transparent text-[#606266] hover:text-[#1c7ffd]') + ' transition-colors';
            descView.classList.toggle('hidden', !isDesc);
            uploadView.classList.toggle('hidden', isDesc);
        }

        // 分析目录描述
        function analyzeCatalog(text) {
            let name = '数据资源目录';
            let domain = '请选择';
            let shareType = '无条件共享';
            let openType = '不予开放';
            let summary = '';
            let themeCategory = '请选择';
            let applicationScene = '请选择';
            let businessCycle = '请选择';
            let dataCycle = '请选择';
            let formatCategory = '数据库';
            let formatType = 'MySQL';
            let shareCondition = '';

            if (text.includes('企业') || text.includes('工商') || text.includes('法人')) {
                name = '企业工商登记信息';
                domain = '经济建设';
                themeCategory = '法人基础信息';
                applicationScene = '市场监管';
                businessCycle = '每日';
                dataCycle = '每日';
                summary = '包含企业名称、统一社会信用代码、注册地址、经营范围、法定代表人等工商登记基本信息。';
                shareCondition = '用于企业资质核验、市场分析等场景，可作为行政依据和工作参考。';
            } else if (text.includes('人口') || text.includes('居民') || text.includes('个人')) {
                name = '常住人口基本信息';
                domain = '社会保障';
                themeCategory = '人口基础信息';
                applicationScene = '政务服务';
                businessCycle = '每月';
                dataCycle = '每月';
                shareType = '有条件共享';
                openType = '不予开放';
                summary = '包含姓名、性别、民族、出生日期、身份证号码、户籍地址等人口基本信息。';
                shareCondition = '用于政务服务、社会管理等场景，需严格控制使用范围。';
            } else if (text.includes('税务') || text.includes('纳税')) {
                name = '税务登记信息';
                domain = '经济建设';
                applicationScene = '市场监管';
                businessCycle = '每月';
                dataCycle = '每月';
                shareType = '有条件共享';
                openType = '不予开放';
                summary = '包含纳税人识别号、纳税人类型、税务登记状态、主管税务机关等信息。';
                shareCondition = '用于税务风控、企业征信等场景，需经授权使用。';
            } else if (text.includes('证照') || text.includes('证件')) {
                name = '电子证照信息';
                domain = '政务服务';
                themeCategory = '电子证照基础信息';
                applicationScene = '政务服务';
                businessCycle = '实时';
                dataCycle = '实时';
                shareCondition = '支持证照核验、亮证应用等场景。';
            } else if (text.includes('信用') || text.includes('征信')) {
                name = '社会信用信息';
                domain = '公共安全';
                themeCategory = '社会信用基础信息';
                applicationScene = '市场监管';
                businessCycle = '每月';
                dataCycle = '每月';
                shareType = '有条件共享';
                openType = '有条件开放';
                summary = '包含企业和个人的信用评价信息、守信激励和失信惩戒记录。';
                shareCondition = '用于信用监管、金融服务等场景。';
            } else if (text.includes('地理') || text.includes('地图') || text.includes('位置')) {
                name = '空间地理基础信息';
                domain = '城市建设';
                themeCategory = '空间地理基础信息';
                applicationScene = '城市治理';
                businessCycle = '每年';
                dataCycle = '每年';
                formatCategory = '文件';
                formatType = 'CSV';
                summary = '包含行政区划边界、地理坐标等空间地理基础数据。';
                shareCondition = '用于地图应用、区域分析等场景。';
            }

            return { name, domain, shareType, openType, summary, themeCategory, applicationScene, businessCycle, dataCycle, formatCategory, formatType, shareCondition };
        }

        // 填充表单字段
        function fillCatalogForm(data) {
            document.getElementById('catalog-name').value = data.name;
            document.getElementById('catalog-summary').value = data.summary;
            
            selectOption('domain', data.domain);
            selectOption('theme-category', data.themeCategory);
            selectOption('application-scene', data.applicationScene);
            selectOption('business-cycle', data.businessCycle);
            selectOption('data-cycle', data.dataCycle);
            selectOption('format-category', data.formatCategory);
            selectOption('format-type', data.formatType);
            document.getElementById('share-condition').value = data.shareCondition;

            // 单选按钮
            document.querySelectorAll('input[name="share-type"]').forEach(radio => {
                radio.checked = radio.value === data.shareType;
            });
            document.querySelectorAll('input[name="open-type"]').forEach(radio => {
                radio.checked = radio.value === data.openType;
            });
        }

        // 选择下拉选项
        function selectOption(id, value) {
            const select = document.getElementById(id);
            if (select) {
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].text === value) {
                        select.selectedIndex = i;
                        break;
                    }
                }
            }
        }

        let currentStep = 1;

        function goToStep(step) {
            currentStep = step;
            
            if (step === 1) {
                document.getElementById('step-1-content').classList.remove('hidden');
                document.getElementById('step-2-content').classList.add('hidden');
                
                document.getElementById('step-1-icon').className = 'w-10 h-10 rounded-full bg-[#1c7ffd] text-white flex items-center justify-center font-bold text-base transition-all';
                document.getElementById('step-1-icon').innerHTML = '1';
                document.getElementById('step-1-text').className = 'mt-3 font-medium text-[#303133] transition-colors';
                document.getElementById('step-2-icon').className = 'w-10 h-10 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center font-bold text-base transition-all';
                document.getElementById('step-2-text').className = 'mt-3 font-medium text-[#909399] transition-colors';
                
                document.getElementById('btn-prev').classList.add('hidden');
                document.getElementById('btn-next').classList.remove('hidden');
                document.getElementById('btn-submit').classList.add('hidden');
            } else {
                document.getElementById('step-1-content').classList.add('hidden');
                document.getElementById('step-2-content').classList.remove('hidden');
                
                document.getElementById('step-1-icon').className = 'w-10 h-10 rounded-full bg-gray-200 text-white flex items-center justify-center font-bold text-base transition-all';
                document.getElementById('step-1-icon').innerHTML = '<i class="fa-solid fa-check text-sm"></i>';
                document.getElementById('step-1-text').className = 'mt-3 font-medium text-[#303133] transition-colors';
                document.getElementById('step-2-icon').className = 'w-10 h-10 rounded-full bg-[#1c7ffd] text-white flex items-center justify-center font-bold text-base transition-all';
                document.getElementById('step-2-icon').innerHTML = '2';
                document.getElementById('step-2-text').className = 'mt-3 font-medium text-[#303133] transition-colors';
                
                document.getElementById('btn-prev').classList.remove('hidden');
                document.getElementById('btn-next').classList.add('hidden');
                document.getElementById('btn-submit').classList.remove('hidden');
            }
            
            document.querySelector('.flex-1.p-6.pb-\\[88px\\].overflow-y-auto').scrollTop = 0;
        }

        function openSmartFillModal() {
            // 重置到描述 Tab，并恢复按钮/进度区状态
            switchFillTab('desc');
            document.getElementById('smart-fill-buttons').classList.remove('hidden');
            document.getElementById('smart-fill-progress').classList.add('hidden');
            // 二次填充提示：覆盖前面内容
            const tip = document.getElementById('fill-tip');
            if (smartFillFilled) {
                tip.textContent = '检测到已填充过目录内容，本次智能填充将覆盖已有内容，请确认后继续。';
            } else {
                tip.textContent = '上传文件或输入描述，系统将智能解析并自动填充目录基本信息';
            }
            document.getElementById('smart-fill-overlay').classList.remove('opacity-0', 'invisible');
            document.getElementById('smart-fill-modal').classList.remove('opacity-0', 'invisible');
        }

        function closeSmartFillModal() {
            document.getElementById('smart-fill-overlay').classList.add('opacity-0', 'invisible');
            document.getElementById('smart-fill-modal').classList.add('opacity-0', 'invisible');
        }

        function handleFileUpload(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                document.getElementById('uploaded-file-info').textContent = `已选择文件：${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
                document.getElementById('uploaded-file-info').classList.remove('hidden');
            }
        }

        // 根据文件名推断目录描述文本
        function describeFromFile(file) {
            const base = file.name.replace(/\.[^.]+$/, '').toLowerCase();
            const map = {
                'enterprise_company': '企业工商登记信息，包含企业名称、统一社会信用代码、注册地址、经营范围、法定代表人等字段',
                'population_resident': '常住人口信息，包含姓名、性别、民族、出生日期、身份证号码、户籍地址等字段',
                'tax_register': '税务登记信息，包含纳税人识别号、税务登记状态、主管税务机关等字段',
                'credit_info': '社会信用信息，包含信用评价、守信激励、失信惩戒等字段',
                'geo_boundary': '空间地理边界数据，包含行政区划边界、地理坐标等字段',
                'license_electronic': '电子证照信息，包含证照编号、证照类型、持证人、有效期等字段',
                'marriage_register': '婚姻登记信息，包含婚姻登记编号、夫妻双方信息、登记日期等字段'
            };
            if (map[base]) return map[base];
            if (/enterprise|company|工商|企业/i.test(file.name)) return '企业工商登记信息，包含企业名称、统一社会信用代码、注册地址、经营范围、法定代表人等字段';
            if (/population|resident|人口|居民/i.test(file.name)) return '常住人口信息，包含姓名、性别、民族、出生日期、身份证号码、户籍地址等字段';
            if (/tax|税务|纳税/i.test(file.name)) return '税务登记信息，包含纳税人识别号、税务登记状态、主管税务机关等字段';
            if (/credit|信用|征信/i.test(file.name)) return '社会信用信息，包含信用评价、守信激励、失信惩戒等字段';
            if (/geo|地理|边界/i.test(file.name)) return '空间地理边界数据，包含行政区划边界、地理坐标等字段';
            return file.name.replace(/\.[^.]+$/, '') + '，包含相关业务字段信息';
        }

        function doSmartFill() {
            const inputText = document.getElementById('smart-fill-input').value.trim();
            const fileInput = document.getElementById('file-upload');
            const hasFile = fileInput.files && fileInput.files.length > 0;

            // 根据当前 Tab 校验输入
            if (currentFillTab === 'desc') {
                if (!inputText) {
                    alert('请输入目录描述');
                    return;
                }
            } else {
                if (!hasFile) {
                    alert('请上传文件');
                    return;
                }
            }

            // 解析出用于分析的描述文本
            const descText = currentFillTab === 'desc' ? inputText : describeFromFile(fileInput.files[0]);

            document.getElementById('smart-fill-buttons').classList.add('hidden');
            document.getElementById('smart-fill-progress').classList.remove('hidden');

            const progressBar = document.getElementById('smart-fill-progress-bar');
            const progressText = document.getElementById('smart-fill-progress-text');
            progressBar.style.width = '0%';
            progressText.textContent = '0%';

            resetProgressSteps();

            setTimeout(() => {
                updateProgress(33, '正在解析输入内容...', 1);

                setTimeout(() => {
                    updateProgress(66, '正在分析目录信息...', 2);

                    setTimeout(() => {
                        updateProgress(100, '正在智能填充表单...', 3);

                        setTimeout(() => {
                            // 智能填充基本信息表单（覆盖前面内容）
                            const catalogData = analyzeCatalog(descText);
                            fillCatalogForm(catalogData);

                            const fillStep3Text = document.getElementById('fill-step-3-text');
                            const fillStep3Icon = document.getElementById('fill-step-3-icon');
                            fillStep3Icon.className = 'w-5 h-5 rounded-full bg-[#00d9a6] text-white flex items-center justify-center text-xs';
                            fillStep3Icon.innerHTML = '<i class="fa-solid fa-check"></i>';
                            fillStep3Text.className = 'text-[#00d9a6]';
                            fillStep3Text.textContent = '智能填充完成，已自动填充目录基本信息';

                            const isOverwrite = smartFillFilled;
                            smartFillFilled = true;

                            setTimeout(() => {
                                closeSmartFillModal();
                                showSmartFillResult(catalogData, isOverwrite);
                            }, 1500);
                        }, 800);
                    }, 800);
                }, 800);
            }, 300);
        }

        function showSmartFillResult(data, isOverwrite) {
            const resultOverlay = document.createElement('div');
            resultOverlay.className = 'fixed inset-0 bg-black/30 z-[95] flex items-center justify-center opacity-0 transition-opacity duration-300';
            const overwriteTip = isOverwrite
                ? `<p class="text-xs text-[#e6a23c] mt-2 flex items-center justify-center gap-1"><i class="fa-solid fa-circle-info"></i>已覆盖之前的填充内容</p>`
                : '';
            resultOverlay.innerHTML = `
                <div class="bg-white rounded-lg shadow-2xl w-[420px] p-6 transform scale-90 transition-transform duration-300">
                    <div class="flex flex-col items-center text-center">
                        <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mb-4">
                            <i class="fa-solid fa-check text-green-500 text-3xl"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-[#303133] mb-2">智能填充完成</h3>

        }

        function parseFieldDescription(text) {
            const patterns = [
                /包含([\u4e00-\u9fa5、，,。]+)等字段?/g,
                /([\u4e00-\u9fa5、，,]+)字段/g,
                /字段包括([\u4e00-\u9fa5、，,。]+)/g
            ];
            
            for (const pattern of patterns) {
                const match = pattern.exec(text);
                if (match && match[1]) {
                    return match[1].split(/[、，,。]/).filter(item => item.trim());
                }
            }
            
            return text.split(/[、，,。\n]/).filter(item => item.trim() && item.length > 1);
        }

        function guessFieldType(name) {
            if (name.includes('日期') || name.includes('时间')) return '日期型D';

            if (name.includes('金额') || name.includes('数量') || name.includes('年龄')) return '数值型N';
            if (name.includes('性别') || name.includes('状态') || name.includes('类型')) return '字符串型C';
            return '字符串型C';

        function guessFieldLength(type) {
