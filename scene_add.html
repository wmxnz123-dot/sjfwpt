<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据服务平台 - 新增场景</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .section-title {
            position: relative;
            padding-left: 14px;
            font-weight: 600;
            color: #303133;
        }
        .section-title::before {
            content: '';
            position: absolute;
            left: 0; top: 50%;
            transform: translateY(-50%);
            width: 4px; height: 14px;
            border-radius: 2px;
            background: #1c7ffd;
        }
        .color-swatch {
            width: 36px; height: 36px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid #e5e7eb;
            transition: transform .15s ease;
        }
        .color-swatch:hover { transform: scale(1.08); }
        .color-swatch.active {
            border-color: #1c7ffd;
            box-shadow: 0 0 0 2px rgba(28,127,253,.25);
        }
        .icon-card {
            width: 64px; height: 64px;
            border-radius: 10px;
            border: 2px solid #e5e7eb;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all .15s ease;
            background: #fff;
            font-size: 24px;
            color: #606266;
        }
        .icon-card:hover { border-color: #1c7ffd; color: #1c7ffd; }
        .icon-card.active {
            border-color: #1c7ffd;
            background: #eef4ff;
            color: #1c7ffd;
            box-shadow: 0 0 0 2px rgba(28,127,253,.15);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-[#f0f2f5] text-[14px] text-gray-700">
    <header class="h-14 bg-[#1c7ffd] flex justify-between items-center px-6 text-white shrink-0 shadow-sm z-10">
        <div class="flex items-center gap-2 cursor-pointer hover:text-gray-200 transition-colors" onclick="window.location.href='index.html'">
            <i class="fa-solid fa-cubes-stacked text-2xl"></i>
            <span class="text-lg font-medium tracking-wider ml-1">数据服务平台</span>
        </div>
        <div class="flex items-center gap-6">
            <div class="relative cursor-pointer hover:text-gray-200 transition-colors" onclick="window.location.href='my_messages.html'">
                <i class="fa-regular fa-bell text-xl"></i>
                <span class="absolute -top-1.5 -right-2 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border border-[#1c7ffd] leading-none">20</span>
            </div>
            <div class="flex items-center gap-2 cursor-pointer hover:text-gray-200 transition-colors">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=yiyun&backgroundColor=b6e3f4" alt="avatar" class="w-8 h-8 rounded-full border border-blue-300 bg-white">
                <span>yiyun</span>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <aside class="w-[220px] bg-white border-r border-gray-200 shrink-0 overflow-y-auto">
            <div id="developer-side-nav" class="py-4"></div>
        </aside>

        <script src="./developer_nav.js?v=20260831b"></script>

        <main class="flex-1 flex flex-col overflow-hidden bg-[#f0f2f5]">
            <div id="developer-top-nav" class="h-[52px] bg-white border-b border-gray-200 px-6 flex items-center gap-2 shrink-0 overflow-x-auto"></div>

            <!-- 面包屑 -->
            <div class="h-[52px] flex items-center px-6 text-[#606266] shrink-0 bg-transparent text-sm">
                <div class="flex items-center gap-2">
                    <a href="config_center.html" class="hover:text-[#1c7ffd] transition-colors">配置中心</a>
                    <i class="fa-solid fa-chevron-right text-[10px] text-gray-300"></i>
                    <a href="config_center.html" class="hover:text-[#1c7ffd] transition-colors">场景配置</a>
                    <i class="fa-solid fa-chevron-right text-[10px] text-gray-300"></i>
                    <span class="text-[#303133] font-medium">新增场景</span>
                </div>
            </div>

            <!-- 返回列表（样式与目录编制页面一致） -->
            <div class="px-6 py-3 bg-white border-b border-gray-100 flex items-center shrink-0">
                <a href="config_center.html" class="text-[#1c7ffd] hover:opacity-80 transition-colors flex items-center gap-1 font-medium text-[15px]">
                    <i class="fa-solid fa-arrow-rotate-left"></i> 返回列表
                </a>
            </div>

            <!-- 内容区 -->
            <div class="flex-1 p-6 pb-24 overflow-y-auto space-y-5">
                <!-- ===== 基本信息配置 ===== -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6">
                    <h3 class="section-title text-[15px] mb-6">基本信息配置<span class="text-red-500 ml-1">*</span></h3>

                    <div class="grid grid-cols-2 gap-x-10 gap-y-5">
                        <!-- 场景名称 -->
                        <div>
                            <label class="block text-sm text-[#606266] mb-2">
                                场景名称<span class="text-red-500 ml-1">*</span>
                            </label>
                            <input type="text" id="scene-name" placeholder="请输入场景名称" class="w-full h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all">
                        </div>

                        <!-- 图标 -->
                        <div>
                            <label class="block text-sm text-[#606266] mb-2">
                                图标<span class="text-red-500 ml-1">*</span>
                            </label>
                            <div class="flex items-center gap-3">
                                <input type="text" id="icon-input" value="fa-building" placeholder="请输入图标名称，如 fa-building" oninput="handleIconInput(this.value)" class="flex-1 h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all">
                                <!-- 输入框右侧小预览，不换行 -->
                                <div class="w-10 h-10 rounded-lg border border-gray-200 flex items-center justify-center text-lg shrink-0" id="icon-inline-preview" style="background:#eef4ff;color:#3B82F6;">
                                    <i class="fa-solid fa-building"></i>
                                </div>
                            </div>
                            <p class="text-xs text-[#909399] mt-1">支持 Font Awesome 图标，输入类名如 fa-building、fa-rocket</p>
                        </div>

                        <!-- 图标颜色 -->
                        <div>
                            <label class="block text-sm text-[#606266] mb-2">
                                图标颜色<span class="text-red-500 ml-1">*</span>
                            </label>
                            <div class="flex items-center gap-3">
                                <div class="color-swatch active" id="color-preview" style="background:#3B82F6" onclick="openColorPicker()"></div>
                                <input type="text" id="color-hex" value="#3B82F6" maxlength="7" oninput="updateColor(this.value)" class="w-[110px] h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all font-mono">
                                <div class="flex items-center gap-1.5 ml-1">
                                    <div class="color-swatch" style="background:#3B82F6; width:24px; height:24px; border-width:1px;" onclick="setColor('#3B82F6')"></div>
                                    <div class="color-swatch" style="background:#10B981; width:24px; height:24px; border-width:1px;" onclick="setColor('#10B981')"></div>
                                    <div class="color-swatch" style="background:#F59E0B; width:24px; height:24px; border-width:1px;" onclick="setColor('#F59E0B')"></div>
                                    <div class="color-swatch" style="background:#EF4444; width:24px; height:24px; border-width:1px;" onclick="setColor('#EF4444')"></div>
                                    <div class="color-swatch" style="background:#8B5CF6; width:24px; height:24px; border-width:1px;" onclick="setColor('#8B5CF6')"></div>
                                    <div class="color-swatch" style="background:#1c7ffd; width:24px; height:24px; border-width:1px;" onclick="setColor('#1c7ffd')"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 图标背景颜色 -->
                        <div>
                            <label class="block text-sm text-[#606266] mb-2">
                                图标背景颜色<span class="text-red-500 ml-1">*</span>
                            </label>
                            <div class="flex items-center gap-3">
                                <div class="color-swatch active" id="bg-color-preview" style="background:#eef4ff" onclick="openBgColorPicker()"></div>
                                <input type="text" id="bg-color-hex" value="#EEF4FF" maxlength="7" oninput="updateBgColor(this.value)" class="w-[110px] h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all font-mono">
                                <div class="flex items-center gap-1.5 ml-1">
                                    <div class="color-swatch" style="background:#eef4ff; width:24px; height:24px; border-width:1px;" onclick="setBgColor('#eef4ff')"></div>
                                    <div class="color-swatch" style="background:#d1fae5; width:24px; height:24px; border-width:1px;" onclick="setBgColor('#d1fae5')"></div>
                                    <div class="color-swatch" style="background:#fef3c7; width:24px; height:24px; border-width:1px;" onclick="setBgColor('#fef3c7')"></div>
                                    <div class="color-swatch" style="background:#fee2e2; width:24px; height:24px; border-width:1px;" onclick="setBgColor('#fee2e2')"></div>
                                    <div class="color-swatch" style="background:#ede9fe; width:24px; height:24px; border-width:1px;" onclick="setBgColor('#ede9fe')"></div>
                                    <div class="color-swatch" style="background:#e0f2fe; width:24px; height:24px; border-width:1px;" onclick="setBgColor('#e0f2fe')"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 场景描述（全宽） -->
                        <div class="col-span-2">
                            <label class="block text-sm text-[#606266] mb-2">场景描述</label>
                            <textarea id="scene-desc" rows="3" placeholder="请输入场景描述（10-50字）" class="w-full px-3 py-2 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all resize-none"></textarea>
                        </div>

                        <!-- 场景图片 -->
                        <div class="col-span-2">
                            <label class="block text-sm text-[#606266] mb-2">
                                场景图片<span class="text-[#909399] ml-1 text-xs">（建议尺寸 750×420，支持 JPG/PNG，最大 2MB）</span>
                            </label>
                            <div class="flex items-start gap-4">
                                <!-- 预览区 -->
                                <div id="scene-image-preview" class="w-[180px] h-[100px] border-2 border-dashed border-gray-200 rounded-lg flex flex-col items-center justify-center bg-gray-50 cursor-pointer hover:border-[#1c7ffd] hover:bg-blue-50/30 transition-all overflow-hidden relative" onclick="document.getElementById('scene-image-input').click()">
                                    <i class="fa-solid fa-cloud-arrow-up text-2xl text-gray-300 mb-1"></i>
                                    <span class="text-xs text-[#909399]">点击上传图片</span>
                                </div>
                                <!-- 操作与说明 -->
                                <div class="flex-1">
                                    <input type="file" id="scene-image-input" accept="image/jpeg,image/png" class="hidden" onchange="handleSceneImageUpload(this)">
                                    <div class="flex items-center gap-2 mb-2">
                                        <button type="button" onclick="document.getElementById('scene-image-input').click()" class="h-[32px] px-4 border border-[#1c7ffd] text-[#1c7ffd] rounded-md text-sm hover:bg-blue-50 transition-colors">
                                            <i class="fa-solid fa-upload mr-1"></i>选择图片
                                        </button>
                                        <button type="button" id="scene-image-remove" onclick="removeSceneImage()" class="h-[32px] px-4 border border-gray-200 text-[#909399] rounded-md text-sm hover:bg-gray-50 hover:text-[#f56c6c] hover:border-[#f56c6c] transition-colors hidden">
                                            <i class="fa-solid fa-trash-can mr-1"></i>移除
                                        </button>
                                    </div>
                                    <p class="text-xs text-[#909399] leading-relaxed">支持上传场景封面图，用于门户场景中心列表及详情页展示。</p>
                                </div>
                            </div>
                        </div>

                        <!-- 是否置顶 -->
                        <div>
                            <label class="block text-sm text-[#606266] mb-2">是否置顶</label>
                            <label class="inline-flex items-center cursor-pointer select-none">
                                <input type="checkbox" id="scene-pinned" class="sr-only peer" onchange="togglePinned(this.checked)">
                                <div class="relative w-[44px] h-[24px] bg-gray-200 peer-checked:bg-[#1c7ffd] rounded-full transition-colors after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-[20px] after:w-[20px] after:transition-all peer-checked:after:translate-x-[20px] shadow-inner"></div>
                                <span id="pinned-label" class="ml-2 text-sm text-[#909399]">不置顶</span>
                            </label>
                            <p class="text-xs text-[#909399] mt-1">开启后该场景将固定在场景中心列表首位展示</p>
                        </div>
                    </div>
                </div>

                <!-- ===== 选择数据目录 ===== -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6">
                    <h3 class="section-title text-[15px] mb-2 flex items-center gap-2">
                        目录选择<span class="text-red-500 ml-1">*</span>
                    </h3>
                    <p class="text-sm text-[#909399] mb-4 ml-[18px]">（可多选，至少选择一个目录）</p>

                    <!-- 顶部操作栏 -->
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <input type="text" id="catalog-search" placeholder="目录名称 / 所属部门" oninput="renderCatalogs()" class="h-[32px] px-3 border border-gray-200 rounded-md text-sm w-[220px] outline-none focus:border-[#1c7ffd] transition-all">
                            <button onclick="resetCatalogFilter()" class="h-[32px] px-3 border border-gray-200 rounded text-[#606266] hover:text-[#1c7ffd] hover:border-[#1c7ffd] text-sm transition-colors">重置</button>
                        </div>
                        <label class="flex items-center gap-1.5 text-sm text-[#606266] cursor-pointer select-none">
                            <input type="checkbox" id="check-all" class="rounded text-[#1c7ffd]" onchange="toggleAllCatalogs()">
                            <span>全选</span>
                            <span class="text-[#909399]">已选 <span id="selected-count" class="text-[#1c7ffd] font-medium">0</span></span>
                        </label>
                    </div>

                    <!-- 目录表格 -->
                    <div class="border border-gray-200 rounded-lg overflow-hidden">
                        <table class="w-full text-sm table-fixed">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-200">
                                    <th class="w-16 py-3 text-center font-medium text-[#606266]">选择框</th>
                                    <th class="px-4 py-3 text-left font-medium text-[#606266]">目录名称</th>
                                    <th class="w-28 px-4 py-3 text-center font-medium text-[#606266]">服务类型</th>
                                    <th class="px-4 py-3 text-left font-medium text-[#606266]">所属单位</th>
                                    <th class="w-32 px-4 py-3 text-center font-medium text-[#606266]">发布时间</th>
                                    <th class="w-28 px-4 py-3 text-center font-medium text-[#606266]">操作</th>
                                </tr>
                            </thead>
                            <tbody id="catalog-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 底部操作栏 -->
            <div class="bg-white border-t border-gray-100 px-8 py-4 flex items-center justify-end gap-3 shrink-0 shadow-[0_-4px_12px_rgba(0,0,0,0.04)]">
                <button onclick="cancel()" class="h-[36px] px-6 border border-gray-200 text-[#606266] rounded-md text-sm hover:bg-gray-50 transition-colors">取消</button>
                <button onclick="publish()" class="h-[36px] px-6 bg-[#1c7ffd] text-white rounded-md text-sm hover:bg-[#0d6efd] transition-colors shadow-sm">发布场景</button>
            </div>
        </main>
    </div>

    <script>
        // ===== 数据：可申请的数据资源 =====
        const catalogs = [
            { name: '企业基础信息库', service: '企业基础信息查询服务', type: 'API', provider: '市市场监督管理局', time: '2024-01-15' },
            { name: '经营变更记录表', service: '企业变更信息查询服务', type: 'API', provider: '市市场监督管理局', time: '2024-01-18' },
            { name: '婚姻登记信息', service: '婚姻登记信息查询服务', type: 'API', provider: '市民政局', time: '2024-02-10' },
            { name: '常住人口基本信息', service: '人口信息核验服务', type: 'API', provider: '市公安局', time: '2024-02-22' },
            { name: '不动产登记信息', service: '不动产信息核验服务', type: 'API', provider: '市自然资源局', time: '2024-03-05' },
            { name: '税务登记信息', service: '企业税务核验服务', type: 'API', provider: '市税务局', time: '2024-03-12' },
            { name: '社会信用评价信息', service: '企业信用查询服务', type: 'API', provider: '市发展改革委', time: '2024-03-20' },
            { name: '电子证照信息', service: '证照核验服务', type: 'API', provider: '市政务服务中心', time: '2024-04-02' },
            { name: '行政区划边界数据', service: '区划查询服务', type: 'API', provider: '市自然资源局', time: '2024-04-15' },
            { name: '教育资源信息', service: '教育资源查询服务', type: 'API', provider: '市教育局', time: '2024-04-28' }
        ];

        let selectedCatalogs = new Set();
        let currentColor = '#3B82F6';
        let currentBgColor = '#eef4ff';

        // ===== 图标输入 =====
        function handleIconInput(val) {
            const name = (val || '').trim();
            if (!name) return;
            const iconEl = document.getElementById('icon-inline-preview');
            iconEl.innerHTML = `<i class="fa-solid ${name}"></i>`;
        }

        // ===== 颜色 =====
        function openColorPicker() {
            const val = document.getElementById('color-hex').value;
            const input = document.createElement('input');
            input.type = 'color';
            input.value = /^#[0-9A-Fa-f]{6}$/.test(val) ? val : '#3B82F6';
            input.onchange = e => setColor(e.target.value);
            input.click();
        }

        function setColor(color) {
            if (!/^#[0-9A-Fa-f]{6}$/.test(color)) return;
            currentColor = color;
            document.getElementById('color-preview').style.background = color;
            document.getElementById('color-hex').value = color.toUpperCase();
            document.getElementById('icon-inline-preview').style.color = color;
        }

        function updateColor(color) {
            if (/^#[0-9A-Fa-f]{6}$/.test(color)) {
                currentColor = color;
                document.getElementById('color-preview').style.background = color;
                document.getElementById('icon-inline-preview').style.color = color;
            }
        }

        // ===== 图标背景颜色 =====
        function openBgColorPicker() {
            const val = document.getElementById('bg-color-hex').value;
            const input = document.createElement('input');
            input.type = 'color';
            input.value = /^#[0-9A-Fa-f]{6}$/.test(val) ? val : '#eef4ff';
            input.onchange = e => setBgColor(e.target.value);
            input.click();
        }

        function setBgColor(color) {
            if (!/^#[0-9A-Fa-f]{6}$/.test(color)) return;
            currentBgColor = color;
            document.getElementById('bg-color-preview').style.background = color;
            document.getElementById('bg-color-hex').value = color.toUpperCase();
            document.getElementById('icon-inline-preview').style.background = color;
        }

        function updateBgColor(color) {
            if (/^#[0-9A-Fa-f]{6}$/.test(color)) {
                currentBgColor = color;
                document.getElementById('bg-color-preview').style.background = color;
                document.getElementById('icon-inline-preview').style.background = color;
            }
        }

        // ===== 目录列表 =====
        function renderCatalogs() {
            const keyword = (document.getElementById('catalog-search').value || '').trim();
            let list = catalogs;
            if (keyword) {
                list = list.filter(c => c.name.includes(keyword) || c.service.includes(keyword));
            }
            const tbody = document.getElementById('catalog-table-body');
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-12 text-center text-[#909399]"><i class="fa-regular fa-folder-open text-2xl mb-2 block opacity-30"></i>暂无目录数据</td></tr>`;
                document.getElementById('check-all').checked = false;
                updateSelectedCount();
                return;
            }
            tbody.innerHTML = list.map((c, i) => `
                <tr class="border-b border-gray-100 hover:bg-blue-50/30 transition-colors">
                    <td class="py-3.5 text-center">
                        <input type="checkbox" class="catalog-check rounded text-[#1c7ffd]" data-idx="${i}" onchange="toggleCatalog(this, ${i})" ${selectedCatalogs.has(i) ? 'checked' : ''}>
                    </td>
                    <td class="px-4 py-3.5 text-[#303133] font-medium">${c.name}</td>
                    <td class="px-4 py-3.5 text-center">
                        <span class="px-2 py-0.5 rounded-md text-xs bg-blue-50 text-[#1c7ffd]">${c.type}</span>
                    </td>
                    <td class="px-4 py-3.5 text-[#606266]">${c.provider}</td>
                    <td class="px-4 py-3.5 text-center text-[#909399]">${c.time}</td>
                    <td class="px-4 py-3.5 text-center">
                        <button onclick="viewCatalog(${i})" class="text-[#1c7ffd] hover:text-[#0d6efd] text-sm">查看详情</button>
                    </td>
                </tr>
            `).join('');
            updateSelectedCount();
        }

        function toggleCatalog(cb, idx) {
            if (cb.checked) selectedCatalogs.add(idx);
            else selectedCatalogs.delete(idx);
            updateSelectedCount();
        }

        function toggleAllCatalogs() {
            const checkAll = document.getElementById('check-all').checked;
            const visibleBoxes = document.querySelectorAll('.catalog-check');
            visibleBoxes.forEach(cb => {
                cb.checked = checkAll;
                const idx = parseInt(cb.dataset.idx);
                if (checkAll) selectedCatalogs.add(idx);
                else selectedCatalogs.delete(idx);
            });
            updateSelectedCount();
        }

        function updateSelectedCount() {
            document.getElementById('selected-count').textContent = selectedCatalogs.size;
            const visibleBoxes = document.querySelectorAll('.catalog-check');
            document.getElementById('check-all').checked = visibleBoxes.length > 0 && Array.from(visibleBoxes).every(cb => cb.checked);
        }

        function resetCatalogFilter() {
            document.getElementById('catalog-search').value = '';
            renderCatalogs();
        }

        function viewCatalog(idx) {
            const c = Array.from(document.querySelectorAll('.catalog-check')).map(cb => parseInt(cb.dataset.idx));
            // 简单展示
            alert('查看目录详情：' + catalogs[idx].name);
        }

        // ===== 场景图片上传 =====
        let sceneImageDataUrl = '';

        function handleSceneImageUpload(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            // 类型校验
            if (!/^image\/(jpeg|png)$/.test(file.type)) {
                alert('仅支持 JPG/PNG 格式图片');
                input.value = '';
                return;
            }
            // 大小校验（2MB）
            if (file.size > 2 * 1024 * 1024) {
                alert('图片大小不能超过 2MB');
                input.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                sceneImageDataUrl = e.target.result;
                const preview = document.getElementById('scene-image-preview');
                preview.innerHTML = '<img src="' + sceneImageDataUrl + '" class="w-full h-full object-cover" alt="场景图片">';
                document.getElementById('scene-image-remove').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function removeSceneImage() {
            sceneImageDataUrl = '';
            const input = document.getElementById('scene-image-input');
            if (input) input.value = '';
            const preview = document.getElementById('scene-image-preview');
            preview.innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-2xl text-gray-300 mb-1"></i><span class="text-xs text-[#909399]">点击上传图片</span>';
            document.getElementById('scene-image-remove').classList.add('hidden');
        }

        // ===== 置顶切换 =====
        function togglePinned(checked) {
            const label = document.getElementById('pinned-label');
            if (checked) {
                label.textContent = '置顶';
                label.classList.remove('text-[#909399]');
                label.classList.add('text-[#1c7ffd]', 'font-medium');
            } else {
                label.textContent = '不置顶';
                label.classList.add('text-[#909399]');
                label.classList.remove('text-[#1c7ffd]', 'font-medium');
            }
        }

        // ===== 底部按钮 =====
        function cancel() {
            if (confirm('确定取消编辑吗？已填写的内容将丢失。')) {
                window.location.href = 'config_center.html';
            }
        }

        function publish() {
            const name = document.getElementById('scene-name').value.trim();
            if (!name) { alert('请填写场景名称'); return; }
            if (selectedCatalogs.size === 0) { alert('请至少选择一个目录'); return; }
            alert('场景「' + name + '」发布成功！');
            window.location.href = 'config_center.html';
        }

        // 初始化
        renderCatalogs();
