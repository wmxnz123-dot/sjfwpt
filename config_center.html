<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据服务平台 - 场景配置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .tree-item { cursor: pointer; transition: all .2s ease; }
        .tree-item:hover { background: #f5f7fa; }
        .tree-item.active { background: #eef4ff; color: #1c7ffd; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-[#f0f2f5] text-[14px] text-gray-700">
    <header class="h-14 bg-[#1c7ffd] flex justify-between items-center px-6 text-white shrink-0 shadow-sm z-10">
        <div class="flex items-center gap-2 cursor-pointer hover:text-gray-200 transition-colors" onclick="window.location.href='index.html'">
            <i class="fa-solid fa-cubes-stacked text-2xl"></i>
            <span class="text-lg font-medium tracking-wider ml-1">数据服务平台</span>
        </div>
        <div class="flex items-center gap-6">
            <div class="relative cursor-pointer hover:text-gray-200 transition-colors" onclick="window.location.href='my_messages.html'">
                <i class="fa-regular fa-bell text-xl"></i>
                <span class="absolute -top-1.5 -right-2 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border border-[#1c7ffd] leading-none">20</span>
            </div>
            <div class="flex items-center gap-2 cursor-pointer hover:text-gray-200 transition-colors">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=yiyun&backgroundColor=b6e3f4" alt="avatar" class="w-8 h-8 rounded-full border border-blue-300 bg-white">
                <span>yiyun</span>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <aside class="w-[220px] bg-white border-r border-gray-200 shrink-0 overflow-y-auto">
            <div id="developer-side-nav" class="py-4"></div>
        </aside>

        <script src="./developer_nav.js?v=20260831b"></script>

        <main class="flex-1 flex flex-col overflow-hidden bg-[#f0f2f5]">
            <div id="developer-top-nav" class="h-[52px] bg-white border-b border-gray-200 px-6 flex items-center gap-2 shrink-0 overflow-x-auto"></div>

            <!-- 面包屑 -->
            <div class="h-[52px] flex items-center px-6 text-[#606266] shrink-0 text-sm">
                <span>配置中心</span>
                <span class="mx-2">/</span>
                <span class="text-[#303133] font-medium">场景配置</span>
            </div>

            <div class="flex-1 p-6 flex gap-5 overflow-hidden">
                <!-- 右侧：场景列表 -->
                <div class="flex-1 bg-white rounded-lg shadow-[0_2px_12px_0_rgba(0,0,0,0.05)] flex flex-col overflow-hidden">
                    <!-- 顶部标题栏 + 新增按钮 -->
                    <div class="h-14 px-5 border-b border-gray-100 flex items-center justify-between shrink-0">
                        <div class="flex items-center gap-3">
                            <h3 class="font-bold text-[#303133]">场景列表</h3>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="flex items-center gap-2">
                                <span class="text-[#606266] text-sm">场景名称：</span>
                                <input type="text" id="search-input" placeholder="请输入" class="border border-gray-300 rounded px-3 py-1.5 text-sm w-[200px] focus:outline-none focus:border-[#1c7ffd] transition-colors">
                            </div>
                            <button onclick="searchScenes()" class="px-4 py-1.5 bg-[#1c7ffd] border border-[#1c7ffd] rounded text-white hover:bg-blue-500 transition-colors text-sm flex items-center gap-1.5 shadow-sm">
                                <i class="fa-solid fa-magnifying-glass"></i> 查询
                            </button>
                            <button onclick="window.location.href='scene_add.html'" class="px-4 py-1.5 bg-[#1c7ffd] border border-[#1c7ffd] rounded text-white hover:bg-blue-500 transition-colors text-sm flex items-center gap-1.5 shadow-sm">
                                <i class="fa-solid fa-plus"></i> 新增
                            </button>
                        </div>
                    </div>

                    <!-- 场景表格 -->
                    <div class="flex-1 overflow-auto">
                        <table class="w-full text-sm table-fixed">
                            <thead class="sticky top-0 bg-gray-50 z-10">
                                <tr class="border-b border-gray-100">
                                    <th class="w-16 px-4 py-3 text-left font-medium text-[#606266]">序号</th>
                                    <th class="px-4 py-3 text-left font-medium text-[#606266]">场景名称</th>
                                    <th class="w-28 px-4 py-3 text-center font-medium text-[#606266]">数据目录数</th>
                                    <th class="w-24 px-4 py-3 text-center font-medium text-[#606266]">是否置顶</th>
                                    <th class="w-24 px-4 py-3 text-center font-medium text-[#606266]">状态</th>
                                    <th class="w-40 px-4 py-3 text-left font-medium text-[#606266]">更新时间</th>
                                    <th class="w-80 px-4 py-3 text-center font-medium text-[#606266]">操作</th>
                                </tr>
                            </thead>
                            <tbody id="scene-table-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 场景详情抽屉 -->
    <div id="sceneDrawerOverlay" class="fixed inset-0 bg-black bg-opacity-30 z-40 hidden transition-opacity" onclick="closeSceneDrawer()"></div>
    <div id="sceneDetailDrawer" class="fixed top-0 right-0 h-full w-[800px] bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="h-14 border-b border-gray-100 flex items-center justify-between px-6 shrink-0 bg-white">
            <span class="font-medium text-[#303133]">场景详情</span>
            <i class="fa-solid fa-xmark text-gray-400 cursor-pointer hover:text-[#1c7ffd] text-lg" onclick="closeSceneDrawer()"></i>
        </div>

        <div class="flex-1 overflow-y-auto p-6 bg-[#f5f7fa]">
            <!-- 场景标题卡片 -->
            <div class="bg-white rounded-lg p-6 shadow-sm mb-4">
                <div class="flex justify-between items-start">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl flex items-center justify-center text-xl shrink-0" id="drawer-scene-icon">
                            <i class="fa-solid fa-building" id="drawer-scene-icon-i"></i>
                        </div>
                        <div>
                            <div class="text-[18px] font-bold text-[#303133] mb-1 flex items-center gap-2">
                                <span id="drawer-scene-name">场景名称</span>
                                <span class="text-[12px] px-2 py-0.5 rounded border font-normal" id="drawer-scene-status">启用</span>
                            </div>
                            <div class="text-[#909399] text-[13px]">所属领域：<span id="drawer-scene-domain">-</span></div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-[#909399] text-[13px] mt-2">更新时间：<span id="drawer-scene-update">-</span></div>
                    </div>
                </div>
            </div>

            <!-- 绑定目录信息 -->
            <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                    <h3 class="font-bold text-[#303133] text-[15px] flex items-center gap-2">
                        <i class="fa-solid fa-folder-tree text-[#1c7ffd]"></i>绑定目录信息
                    </h3>
                    <span class="text-xs text-[#909399]">目录总数：<span class="text-[#1c7ffd] font-bold" id="drawer-catalog-total">0</span> 个</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200">
                                <th class="px-4 py-3 text-left font-medium text-[#606266]">目录名称</th>
                                <th class="w-28 px-4 py-3 text-center font-medium text-[#606266]">服务类型</th>
                                <th class="px-4 py-3 text-left font-medium text-[#606266]">所属单位</th>
                                <th class="w-32 px-4 py-3 text-center font-medium text-[#606266]">发布时间</th>
                                <th class="w-24 px-4 py-3 text-center font-medium text-[#606266]">操作</th>
                            </tr>
                        </thead>
                        <tbody id="drawer-catalog-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 确认弹窗（删除等危险操作） -->
    <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-30 z-[70] hidden flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-2xl w-[440px] overflow-hidden">
            <div class="px-6 py-5 flex items-start gap-3 border-b border-gray-100">
                <i class="fa-solid fa-triangle-exclamation text-[#f56c6c] text-2xl mt-0.5"></i>
                <div class="flex-1">
                    <div class="text-[#303133] text-[15px] font-medium mb-1" id="confirmTitle">删除确认</div>
                    <span id="confirmMessage" class="text-[#606266] text-[13px] leading-relaxed block"></span>
                </div>
            </div>
            <div class="px-6 py-4 flex justify-end gap-3 bg-white">
                <button class="px-5 h-8 border border-gray-300 rounded text-[#606266] hover:text-[#1c7ffd] hover:border-[#1c7ffd] transition-colors text-sm" onclick="closeConfirm()">取 消</button>
                <button class="px-5 h-8 bg-[#f56c6c] text-white rounded hover:bg-[#d9363e] transition-colors text-sm" id="confirmOkBtn">确认删除</button>
            </div>
        </div>
    </div>

    <script>
        // 领域分类数据
        const domains = [
            { id: 'all', name: '全部领域', icon: 'fa-layer-group' },
            { id: 'yimin', name: '一码一表', icon: 'fa-qrcode' },
            { id: 'zhizao', name: '智慧治理', icon: 'fa-city' },
            { id: 'minzheng', name: '民生保障', icon: 'fa-house-chimney-medical' },
            { id: 'shengtai', name: '生态环保', icon: 'fa-leaf' },
            { id: 'wulian', name: '物联网', icon: 'fa-wifi' },
            { id: 'shuzi', name: '数字经济', icon: 'fa-chart-line' },
            { id: 'jiaoyu', name: '智慧教育', icon: 'fa-graduation-cap' }
        ];

        // 场景数据
        let sceneData = [
            {
                id: 1, name: '企业开办一站式服务', domain: 'yimin', domainName: '一码一表', catalogCount: 12,
                status: '启用', updateTime: '2026-07-28 14:30', pinned: true,
                icon: 'fa-building', iconColor: '#1c7ffd'
            },
            {
                id: 2, name: '人口健康服务场景', domain: 'minzheng', domainName: '民生保障', catalogCount: 8,
                status: '启用', updateTime: '2026-07-26 09:15', pinned: false,
                icon: 'fa-heart-pulse', iconColor: '#00b894'
            },
            {
                id: 3, name: '城市治理一张图', domain: 'zhizao', domainName: '智慧治理', catalogCount: 20,
                status: '启用', updateTime: '2026-07-24 16:45', pinned: false,
                icon: 'fa-map', iconColor: '#667eea'
            },
            {
                id: 4, name: '大气污染防治监测', domain: 'shengtai', domainName: '生态环保', catalogCount: 6,
                status: '停用', updateTime: '2026-07-20 11:20', pinned: false,
                icon: 'fa-leaf', iconColor: '#00d9a6'
            },
            {
                id: 5, name: '物联网设备监管', domain: 'wulian', domainName: '物联网', catalogCount: 15,
                status: '启用', updateTime: '2026-07-18 10:00', pinned: false,
                icon: 'fa-wifi', iconColor: '#36c2aa'
            },
            {
                id: 6, name: '数字经济产业图谱', domain: 'shuzi', domainName: '数字经济', catalogCount: 10,
                status: '停用', updateTime: '2026-07-15 15:30', pinned: false,
                icon: 'fa-chart-line', iconColor: '#f39c12'
            },
            {
                id: 7, name: '教育资源共享平台', domain: 'jiaoyu', domainName: '智慧教育', catalogCount: 5,
                status: '启用', updateTime: '2026-07-12 08:40', pinned: false,
                icon: 'fa-graduation-cap', iconColor: '#e74c3c'
            },
            {
                id: 8, name: '企业信用一键查', domain: 'yimin', domainName: '一码一表', catalogCount: 9,
                status: '启用', updateTime: '2026-07-10 13:25', pinned: true,
                icon: 'fa-shield-halved', iconColor: '#8e44ad'
            }
        ];

        let currentDomain = 'all';
        let currentDrawerCatalogs = [];

        // 渲染领域树
        function renderDomains() {
            const container = document.getElementById('domain-tree');
            if (!container) return;
            container.innerHTML = domains.map(d => `
                <div class="tree-item flex items-center gap-2.5 px-4 py-2.5 mx-2 rounded-lg ${d.id === currentDomain ? 'active' : ''}" data-domain="${d.id}" onclick="selectDomain('${d.id}')">
                    <i class="fa-solid ${d.icon} w-5 text-center"></i>
                    <span class="flex-1 truncate">${d.name}</span>
                    ${d.id !== 'all' ? `<span class="text-xs text-[#909399]">${sceneData.filter(s => s.domain === d.id).length}</span>` : `<span class="text-xs text-[#909399]">${sceneData.length}</span>`}
                </div>
            `).join('');
        }

        // 选择领域
        function selectDomain(domainId) {
            currentDomain = domainId;
            renderDomains();
            renderScenes();
        }

        // 渲染场景列表
        function renderScenes() {
            const keyword = (document.getElementById('search-input').value || '').trim();
            let list = sceneData;
            if (currentDomain !== 'all') {
                list = list.filter(s => s.domain === currentDomain);
            }
            if (keyword) {
                list = list.filter(s => s.name.includes(keyword));
            }

            // 置顶场景优先展示
            list = [...list].sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return 0;
            });

            const filterName = domains.find(d => d.id === currentDomain);
            const filterLabel = document.getElementById('scene-filter-label');
            if (filterLabel) filterLabel.textContent = (filterName ? filterName.name : '全部领域') + (keyword ? ' · "' + keyword + '"' : '');

            const tbody = document.getElementById('scene-table-body');
            if (list.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="py-16 text-center text-[#909399]">
                            <i class="fa-regular fa-folder-open text-3xl mb-2 block opacity-30"></i>
                            暂无场景数据
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = list.map((s, i) => `
                <tr class="border-b border-gray-100 hover:bg-blue-50/50 transition-colors">
                    <td class="px-4 py-3.5 text-[#909399]">${i + 1}</td>
                    <td class="px-4 py-3.5">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[#303133] font-medium">${s.name}</span>
                            ${s.pinned ? '<span class="inline-flex items-center px-1.5 py-0.5 text-[11px] font-bold text-white rounded-[10px] whitespace-nowrap" style="background: linear-gradient(135deg, #f56c6c, #ff7875); box-shadow: 0 2px 4px rgba(245,108,108,0.3);">置顶</span>' : ''}
                        </div>
                    </td>
                    <td class="px-4 py-3.5 text-center text-[#1c7ffd] font-medium">${s.catalogCount}</td>
                    <td class="px-4 py-3.5 text-center">
                        <button onclick="toggleScenePinned(${s.id})" class="relative inline-flex w-10 h-6 items-center rounded-full transition-colors ${s.pinned ? 'bg-[#f56c6c]' : 'bg-gray-300'}" title="点击切换置顶">
                            <span class="inline-block w-4 h-4 transform rounded-full bg-white shadow transition-transform ${s.pinned ? 'translate-x-5' : 'translate-x-1'}"></span>
                        </button>
                    </td>
                    <td class="px-4 py-3.5 text-center">
                        <button onclick="toggleSceneStatus(${s.id})" class="relative inline-flex w-10 h-6 items-center rounded-full transition-colors ${s.status === '启用' ? 'bg-green-500' : 'bg-gray-300'}" title="点击切换状态">
                            <span class="inline-block w-4 h-4 transform rounded-full bg-white shadow transition-transform ${s.status === '启用' ? 'translate-x-5' : 'translate-x-1'}"></span>
                        </button>
                    </td>
                    <td class="px-4 py-3.5 text-[#909399]">${s.updateTime}</td>
                    <td class="px-3 py-3.5">
                        <div class="flex items-center justify-center gap-0.5 whitespace-nowrap">
                            <button onclick="viewScene(${s.id})" class="px-2 py-1 text-[#606266] hover:text-[#1c7ffd] hover:bg-blue-50 rounded transition-colors whitespace-nowrap">查看</button>
                            <button onclick="editScene(${s.id})" class="px-2 py-1 text-[#606266] hover:text-[#1c7ffd] hover:bg-blue-50 rounded transition-colors whitespace-nowrap">编辑</button>
                            <button onclick="deleteScene(${s.id})" class="px-2 py-1 text-[#606266] hover:text-red-500 hover:bg-red-50 rounded transition-colors whitespace-nowrap">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // 切换置顶状态
        function toggleScenePinned(id) {
            const s = sceneData.find(x => x.id === id);
            if (!s) return;
            s.pinned = !s.pinned;
            renderScenes();
        }

        function searchScenes() {
            renderScenes();
        }

        function toggleSceneStatus(id) {
            const scene = sceneData.find(s => s.id === id);
            if (!scene) return;
            scene.status = scene.status === '启用' ? '停用' : '启用';
            renderScenes();
        }

        // 操作函数
        function viewScene(id) {
            const s = sceneData.find(x => x.id === id);
            if (!s) return;
            // 顶部场景标题
            const iconI = document.getElementById('drawer-scene-icon-i');
            iconI.className = `fa-solid ${s.icon}`;
            const iconBox = document.getElementById('drawer-scene-icon');
            iconBox.style.background = (s.iconColor || '#1c7ffd') + '1a';
            iconBox.style.color = s.iconColor || '#1c7ffd';
            document.getElementById('drawer-scene-name').textContent = s.name;
            document.getElementById('drawer-scene-domain').textContent = s.domainName;
            document.getElementById('drawer-scene-update').textContent = s.updateTime;
            const st = document.getElementById('drawer-scene-status');
            st.textContent = s.status;
            if (s.status === '启用') { st.className = 'text-[12px] px-2 py-0.5 rounded border font-normal bg-green-50 text-green-600 border-green-200'; }
            else { st.className = 'text-[12px] px-2 py-0.5 rounded border font-normal bg-gray-100 text-[#909399] border-gray-200'; }
            // 绑定目录信息
            const list = buildSceneCatalogs(s);
            currentDrawerCatalogs = list;
            document.getElementById('drawer-catalog-total').textContent = list.length;
            document.getElementById('drawer-catalog-list').innerHTML = list.map((c, i) => `
                <tr class="border-b border-gray-100 hover:bg-blue-50/30 transition-colors">
                    <td class="px-4 py-3.5 text-[#303133] font-medium">${c.name}</td>
                    <td class="px-4 py-3.5 text-center">
                        <span class="px-2 py-0.5 rounded-md text-xs bg-blue-50 text-[#1c7ffd]">${c.type}</span>
                    </td>
                    <td class="px-4 py-3.5 text-[#606266]">${c.provider}</td>
                    <td class="px-4 py-3.5 text-center text-[#909399]">${c.time}</td>
                    <td class="px-4 py-3.5 text-center">
                        <button onclick="viewDrawerCatalog(${i})" class="text-[#1c7ffd] hover:text-[#0d6efd] text-sm">查看</button>
                    </td>
                </tr>
            `).join('');
            // 打开抽屉
            document.getElementById('sceneDetailDrawer').classList.remove('translate-x-full');
            document.getElementById('sceneDrawerOverlay').classList.remove('hidden');
            document.getElementById('sceneDrawerOverlay').classList.add('opacity-100');
        }

        function closeSceneDrawer() {
            document.getElementById('sceneDetailDrawer').classList.add('translate-x-full');
            const overlay = document.getElementById('sceneDrawerOverlay');
            overlay.classList.remove('opacity-100');
            overlay.classList.add('hidden');
        }

        // 根据场景生成绑定目录列表（模拟数据）
        function buildSceneCatalogs(s) {
            const catalogTemplates = ['企业登记信息库', '工商变更记录表', '法人基础信息库', '信用评价数据目录', '人口基础信息库', '健康档案数据目录', '城市空间地理目录', '环境质量监测目录', '数字产业企业目录', '教育资源信息', '政务服务事项目录'];
            const providers = ['市市场监督管理局', '市公安局', '市卫生健康委', '市自然资源局', '市生态环境局', '市大数据局', '市教育局', '市政务服务中心'];
            const n = Math.min(s.catalogCount, catalogTemplates.length);
            const list = [];
            for (let i = 0; i < n; i++) {
                list.push({ name: catalogTemplates[i], type: 'API', provider: providers[i % providers.length], time: '2024-' + String((i % 12) + 1).padStart(2, '0') + '-' + String((i % 28) + 1).padStart(2, '0') });
            }
            return list;
        }

        // 查看抽屉内目录详情
        function viewDrawerCatalog(idx) {
            const c = currentDrawerCatalogs[idx];
            if (!c) return;
            alert('目录详情：\n目录名称：' + c.name + '\n服务类型：' + c.type + '\n所属单位：' + c.provider + '\n发布时间：' + c.time);
        }

        function editScene(id) {
            window.location.href = 'scene_add.html?edit=' + id;
        }

        function deleteScene(id) {
            const s = sceneData.find(x => x.id === id);
            if (!s) return;
            showConfirm(
                '删除确认',
                '确定要删除场景「' + s.name + '」吗？删除后数据将无法恢复，请谨慎操作！',
                function() {

        function showConfirm(title, message, onOk) {
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmTitle').textContent = title || '删除确认';
            document.getElementById('confirmMessage').textContent = message || '';
            const okBtn = document.getElementById('confirmOkBtn');
            // 克隆替换，移除之前绑定的事件
            const newBtn = okBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newBtn, okBtn);
            newBtn.addEventListener('click', function() {
                closeConfirm();
                if (typeof onOk === 'function') onOk();
            });
            modal.classList.remove('hidden');
        }

        function closeConfirm() {
            document.getElementById('confirmModal').classList.add('hidden');
        }

        renderDomains();
