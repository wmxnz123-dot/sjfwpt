<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据服务平台 - 数据篮</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="portal_common.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #0f52ba 0%, #1c7ffd 50%, #5a8bfb 100%); }
    </style>
</head>
<body class="bg-[#f5f7fa] text-[14px] text-gray-700">
    <script>PortalCommon.renderHeader('home');</script>

    <main class="pt-24 pb-12 max-w-[1440px] mx-auto px-6">
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <div class="w-1 h-6 bg-[#1c7ffd] rounded-full"></div>
                <h1 class="text-xl font-bold text-[#303133]">数据篮</h1>
            </div>
            <button onclick="clearBasket()" class="text-[#909399] hover:text-red-500 text-sm transition-colors flex items-center gap-1">
                <i class="fa-regular fa-trash-can"></i>
                清空数据篮
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-8">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center gap-2">
                <i class="fa-solid fa-clipboard-list text-[#1c7ffd]"></i>
                <h2 class="text-base font-semibold text-[#303133]">申请服务列表</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100">
                            <th class="px-6 py-3 text-left font-medium text-[#606266]">需求级别</th>
                            <th class="px-6 py-3 text-left font-medium text-[#606266]">需求目录</th>
                            <th class="px-6 py-3 text-left font-medium text-[#606266]">需求服务</th>
                            <th class="px-6 py-3 text-left font-medium text-[#606266]">服务类型</th>
                            <th class="px-6 py-3 text-left font-medium text-[#606266]">数据提供部门</th>
                            <th class="px-6 py-3 text-right font-medium text-[#606266]">调用频次（平均）</th>
                            <th class="px-6 py-3 text-right font-medium text-[#606266]">调用频次（峰值）</th>
                            <th class="px-6 py-3 text-left font-medium text-[#606266]">附件上传状态</th>
                            <th class="px-6 py-3 text-left font-medium text-[#606266]">操作</th>
                        </tr>
                    </thead>
                    <tbody id="basket-tbody">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-8">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-[#1c7ffd]"></i>
                <h2 class="text-base font-semibold text-[#303133]">定制服务列表</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100">
                            <th class="px-6 py-3 text-left font-medium text-[#606266]">需求级别</th>
                            <th class="px-6 py-3 text-left font-medium text-[#606266]">需求目录</th>
                            <th class="px-6 py-3 text-left font-medium text-[#606266]">需求服务</th>
                            <th class="px-6 py-3 text-left font-medium text-[#606266]">服务类型</th>
                            <th class="px-6 py-3 text-left font-medium text-[#606266]">数据提供部门</th>
                            <th class="px-6 py-3 text-right font-medium text-[#606266]">调用频次（平均）</th>
                            <th class="px-6 py-3 text-right font-medium text-[#606266]">调用频次（峰值）</th>
                            <th class="px-6 py-3 text-left font-medium text-[#606266]">附件上传状态</th>
                            <th class="px-6 py-3 text-left font-medium text-[#606266]">操作</th>
                        </tr>
                    </thead>
                    <tbody id="custom-service-tbody"></tbody>
                </table>
            </div>
        </div>

        <div class="sticky bottom-4 flex justify-end z-30 pointer-events-none">
            <button class="px-8 py-3 bg-[#1c7ffd] text-white rounded-lg hover:bg-[#1a73e8] transition-colors text-sm font-medium shadow-lg flex items-center gap-2 pointer-events-auto">
                <i class="fa-solid fa-file-signature"></i>
                发起工单
            </button>
        </div>
    </main>

    <script>PortalCommon.renderFooter();</script>

    <div id="edit-api-modal" class="fixed inset-0 z-[80] hidden">
        <div class="absolute inset-0 bg-black/50" onclick="closeEditApi()"></div>
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[520px] bg-white rounded-xl shadow-2xl">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                <h3 class="text-base font-semibold text-[#303133]">编辑</h3>
                <button onclick="closeEditApi()" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-[#909399] transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6 space-y-5">
                <div class="bg-blue-50 rounded-lg px-4 py-3 flex items-start gap-3">
                    <i class="fa-solid fa-circle-info text-[#1c7ffd] mt-0.5"></i>
                    <div class="text-sm text-[#606266]">
                        <div class="font-medium text-[#303133] mb-1" id="edit-api-service-name">服务名称</div>
                        <div>接口类型服务需要设置预估调用频次</div>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#606266] mb-2">
                        调用频次（平均）<span class="text-red-500">*</span>
                        <span class="text-[#909399] font-normal ml-1">次/天</span>
                    </label>
                    <input type="number" id="edit-api-freq-avg" placeholder="请输入平均调用频次" min="1" class="w-full h-10 px-3 border border-gray-200 rounded-lg text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#606266] mb-2">
                        调用频次（峰值）<span class="text-red-500">*</span>
                        <span class="text-[#909399] font-normal ml-1">次/天</span>
                    </label>
                    <input type="number" id="edit-api-freq-peak" placeholder="请输入峰值调用频次" min="1" class="w-full h-10 px-3 border border-gray-200 rounded-lg text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd]">
                </div>
            </div>
            <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100">
                <button onclick="closeEditApi()" class="px-5 py-2 border border-gray-200 text-[#606266] rounded-lg text-sm hover:bg-gray-50 transition-colors">
                    取消
                </button>
                <button onclick="confirmEditApi()" class="px-5 py-2 bg-[#1c7ffd] text-white rounded-lg text-sm hover:bg-[#1a73e8] transition-colors">
                    确定
                </button>
            </div>
        </div>
    </div>

    <div id="upload-attachment-modal" class="fixed inset-0 z-[80] hidden">
        <div class="absolute inset-0 bg-black/50" onclick="closeUploadAttachment()"></div>
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[560px] bg-white rounded-xl shadow-2xl">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                <h3 class="text-base font-semibold text-[#303133]">上传附件</h3>
                <button onclick="closeUploadAttachment()" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-[#909399] transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6">
                <div class="mb-4">
                    <div class="text-sm font-medium text-[#606266] mb-2" id="upload-service-name">服务名称</div>
                </div>
                <div class="border-2 border-dashed border-gray-200 rounded-lg p-8 text-center hover:border-[#1c7ffd] hover:bg-blue-50/30 transition-colors cursor-pointer" onclick="document.getElementById('file-input').click()">
                    <input type="file" id="file-input" class="hidden" multiple onchange="handleFileSelect(event)">
                    <div class="w-14 h-14 rounded-full bg-blue-50 mx-auto flex items-center justify-center mb-3">
                        <i class="fa-solid fa-cloud-arrow-up text-[#1c7ffd] text-2xl"></i>
                    </div>
                    <div class="text-sm font-medium text-[#303133] mb-1">点击或拖拽文件到此处上传</div>
                    <div class="text-xs text-[#909399]">支持 PDF、Word、Excel、图片等格式，单个文件不超过 20MB</div>
                </div>
                <div class="mt-4 space-y-2" id="upload-file-list"></div>
            </div>
            <div class="flex items-center justify-between px-6 py-4 border-t border-gray-100">
                <div class="flex items-center gap-4">
                    <button onclick="downloadTemplate()" class="text-xs text-[#1c7ffd] hover:text-[#0d6efd] flex items-center gap-1 transition-colors">
                        <i class="fa-solid fa-download"></i>
                        下载模板
                    </button>
                    <div class="text-xs text-[#909399]" id="upload-count-tip">已上传 0 个附件</div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="closeUploadAttachment()" class="px-5 py-2 border border-gray-200 text-[#606266] rounded-lg text-sm hover:bg-gray-50 transition-colors">
                        取消
                    </button>
                    <button onclick="confirmUploadAttachment()" class="px-5 py-2 bg-[#1c7ffd] text-white rounded-lg text-sm hover:bg-[#1a73e8] transition-colors">
                        确定上传
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-success" class="fixed top-24 left-1/2 -translate-x-1/2 z-[100] hidden">
        <div class="bg-green-500 text-white px-5 py-2.5 rounded-lg shadow-lg flex items-center gap-2 text-sm">
            <i class="fa-solid fa-circle-check"></i>
            <span id="toast-msg">操作成功</span>
        </div>
    </div>

    <script>
        let currentEditIndex = -1;
        let currentUploadIndex = -1;
        let tempUploadFiles = [];

        const presetBasketData = [
            {
                id: 'preset_1',
                level: '市县级',
                catalog: '群防群治队伍',
                serviceName: '群防队伍信息',
                isApi: true,
                resourceTypeText: '接口',
                provider: '中共xx市委政法委',
                freqAvg: '500',
                freqPeak: '1000',
                attachmentStatus: '已上传',
                attachmentList: [{ name: '数据使用申请表.docx', size: '12.5 KB', time: '2026-08-28 09:15' }]
            },
            {
                id: 'preset_2',
                level: '市县级',
                catalog: '企业基本信息',
                serviceName: '企业登记信息查询',
                isApi: true,
                resourceTypeText: '接口',
                provider: 'xx市市场监督管理局',
                freqAvg: '2000',
                freqPeak: '5000',
                attachmentStatus: '未上传',
                attachmentList: []
            },
            {
                id: 'preset_3',
                level: '省级',
                catalog: '人口基础信息',
                serviceName: '常住人口基本信息库表',
                isApi: false,
                resourceTypeText: '库表',
                provider: 'xx省公安厅',
                freqAvg: '',
                freqPeak: '',
                attachmentStatus: '已上传',
                attachmentList: [{ name: '数据授权书.pdf', size: '85.2 KB', time: '2026-08-25 14:30' }]
            },
            {
                id: 'preset_4',
                level: '市县级',
                catalog: '不动产登记信息',
                serviceName: '不动产登记数据文件',
                isApi: false,
                resourceTypeText: '文件',
                provider: 'xx市自然资源和规划局',
                freqAvg: '',
                freqPeak: '',
                attachmentStatus: '未上传',
                attachmentList: []
            },
            {
                id: 'preset_5',
                level: '市县级',
                catalog: '社会保障',
                serviceName: '社保缴费信息接口',
                isApi: true,
                resourceTypeText: '接口',
                provider: 'xx市人力资源和社会保障局',
                freqAvg: '800',
                freqPeak: '2000',
                attachmentStatus: '已上传',
                attachmentList: [{ name: '数据使用申请表.docx', size: '12.5 KB', time: '2026-08-27 10:22' }, { name: '数据清单.xlsx', size: '45.8 KB', time: '2026-08-27 10:25' }]
            },
            {
                id: 'preset_6',
                level: '省级',
                catalog: '法人基础信息',
                serviceName: '法人单位基本信息库表',
                isApi: false,
                resourceTypeText: '库表',
                provider: 'xx市统计局',
                freqAvg: '',
                freqPeak: '',
                attachmentStatus: '未上传',
                attachmentList: []
            }
        ];

        const PRESET_VERSION = 'v2';
        function getBasketList() {
            try {
                const storedVersion = localStorage.getItem('basket_list_version') || '';
                if (storedVersion !== PRESET_VERSION) {
                    localStorage.setItem('basket_list', JSON.stringify(presetBasketData));
                    localStorage.setItem('basket_list_version', PRESET_VERSION);
                    return presetBasketData;
                }
                const stored = JSON.parse(localStorage.getItem('basket_list') || '[]');
                if (stored.length === 0) {
                    localStorage.setItem('basket_list', JSON.stringify(presetBasketData));
                    return presetBasketData;
                }
                // 数据过多时自动精简，只保留前 MAX_BASKET_ITEMS 条
                const MAX_BASKET_ITEMS = 20;
                if (stored.length > MAX_BASKET_ITEMS) {
                    const trimmed = stored.slice(0, MAX_BASKET_ITEMS);
                    localStorage.setItem('basket_list', JSON.stringify(trimmed));
                    return trimmed;
                }
                return stored;
            } catch (e) { return presetBasketData; }
        }

        function saveBasketList(list) {
            localStorage.setItem('basket_list', JSON.stringify(list));
            updateFloatBasketBadge();
        }

        function updateFloatBasketBadge() {
            const count = getBasketList().length;
            const badgeWrap = document.querySelector('.fixed.bottom-40.right-8');
            if (!badgeWrap) return;
            const badge = badgeWrap.querySelector('.bg-red-500');
            if (!badge) return;
            const span = badge.querySelector('span');
            if (count > 0) {
                badge.style.display = 'flex';
                if (span) span.textContent = count;
            } else {
                badge.style.display = 'none';
            }
        }

        // 定制服务列表渲染（读取需求定制提交的数据）
        function renderCustomServices() {
            const tbody = document.getElementById('custom-service-tbody');
            let list = [];
            try { list = JSON.parse(localStorage.getItem('custom_services') || '[]'); } catch (e) { list = []; }
            if (list.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="px-6 py-16 text-center">
                            <div class="flex flex-col items-center gap-3">
                                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center">
                                    <i class="fa-solid fa-inbox text-gray-300 text-2xl"></i>
                                </div>
                                <p class="text-[#909399]">暂无数据</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }
            tbody.innerHTML = list.map((c, i) => `
                <tr class="border-b border-gray-100 hover:bg-blue-50/30 transition-colors">
                    <td class="px-6 py-3.5 text-[#606266]">${c.level || '-'}</td>
                    <td class="px-6 py-3.5 text-[#303133] font-medium">${c.catalog || '-'}</td>
                    <td class="px-6 py-3.5 text-[#606266]">${c.service || '-'}</td>
                    <td class="px-6 py-3.5 text-[#606266]">${c.type || '-'}</td>
                    <td class="px-6 py-3.5 text-[#606266]">${c.provider || '-'}</td>
                    <td class="px-6 py-3.5 text-right text-[#606266]">${c.freqAvg || '-'} 次/天</td>
                    <td class="px-6 py-3.5 text-right text-[#606266]">${c.freqPeak || '-'} 次/天</td>
                    <td class="px-6 py-3.5 text-[#606266]">
                        <span class="px-2 py-0.5 rounded-md text-xs ${c.status === '已上传' ? 'bg-green-50 text-green-600' : 'bg-gray-100 text-[#909399]'}">${c.status || '未上传'}</span>
                    </td>
                    <td class="px-6 py-3.5 text-center whitespace-nowrap">
                        <button onclick="openUploadAttachment(${i})" class="px-2.5 py-1 text-[#1c7ffd] hover:text-[#0d6efd] transition-colors">上传附件</button>
                        <button onclick="deleteCustomService(${i})" class="px-2.5 py-1 text-[#606266] hover:text-red-500 transition-colors">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        // 删除定制服务
        function deleteCustomService(idx) {
            let list = [];
            try { list = JSON.parse(localStorage.getItem('custom_services') || '[]'); } catch (e) { list = []; }
            if (idx < 0 || idx >= list.length) return;
            list.splice(idx, 1);
            localStorage.setItem('custom_services', JSON.stringify(list));
            renderCustomServices();
            showToast('已删除');
        }

        function renderBasket() {
            const list = getBasketList();
            const tbody = document.getElementById('basket-tbody');
            if (list.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="px-6 py-16 text-center">
                            <div class="flex flex-col items-center gap-3">
                                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center">
                                    <i class="fa-solid fa-inbox text-gray-300 text-2xl"></i>
                                </div>
                                <p class="text-[#909399]">暂无数据</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }
            tbody.innerHTML = list.map((item, idx) => {
                const statusColor = item.attachmentStatus === '已上传' ? 'text-[#52c41a]' : 'text-[#595959]';
                const uploadText = item.attachmentStatus === '已上传' ? '重新上传' : '上传附件';
                const typeClass = item.isApi
                    ? 'bg-blue-50 text-[#1c7ffd]'
                    : 'bg-gray-50 text-[#606266]';

                let ops = [];
                if (item.isApi) {
                    ops.push(`<a onclick="openEditApi(${idx})" class="text-[#1c7ffd] hover:text-[#1a73e8] cursor-pointer">编辑</a>`);
                }
                ops.push(`<a onclick="deleteRow(${idx})" class="text-[#1c7ffd] hover:text-[#1a73e8] cursor-pointer">移除</a>`);
                ops.push(`<a onclick="openUploadAttachment(${idx})" class="text-[#1c7ffd] hover:text-[#1a73e8] cursor-pointer">${uploadText}</a>`);

                return `
                    <tr class="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 text-[#303133]">${item.level || '市县级'}</td>
                        <td class="px-6 py-4 text-[#303133]">${item.catalog || '-'}</td>
                        <td class="px-6 py-4 text-[#303133]">${item.serviceName || '-'}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-0.5 ${typeClass} text-xs rounded">${item.resourceTypeText || '-'}</span>
                        </td>
                        <td class="px-6 py-4 text-[#606266]">${item.provider || '-'}</td>
                        <td class="px-6 py-4 text-right text-[#606266]">${item.freqAvg || '-'}</td>
                        <td class="px-6 py-4 text-right text-[#606266]">${item.freqPeak || '-'}</td>
                        <td class="px-6 py-4 ${statusColor}">${item.attachmentStatus || '未上传'}</td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-4">
                                ${ops.join('')}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function deleteRow(idx) {
            if (!confirm('确定要移除该数据吗？')) return;
            const list = getBasketList();
            list.splice(idx, 1);
            saveBasketList(list);
            renderBasket();
            showToast('移除成功');
        }

        function clearBasket() {
            if (!confirm('确定要清空数据篮吗？')) return;
            saveBasketList([]);
            renderBasket();
        }

        function openEditApi(idx) {
            const list = getBasketList();
            const item = list[idx];
            if (!item) return;
            currentEditIndex = idx;
            document.getElementById('edit-api-service-name').textContent = item.serviceName;
            document.getElementById('edit-api-freq-avg').value = item.freqAvg || '';
            document.getElementById('edit-api-freq-peak').value = item.freqPeak || '';
            document.getElementById('edit-api-modal').classList.remove('hidden');
        }
        function closeEditApi() {
            document.getElementById('edit-api-modal').classList.add('hidden');
            currentEditIndex = -1;
        }
        function confirmEditApi() {
            const freqAvg = document.getElementById('edit-api-freq-avg').value.trim();
            const freqPeak = document.getElementById('edit-api-freq-peak').value.trim();
            if (!freqAvg) { alert('请输入平均调用频次'); return; }
            if (!freqPeak) { alert('请输入峰值调用频次'); return; }
            if (parseInt(freqAvg) <= 0) { alert('平均调用频次必须大于0'); return; }
            if (parseInt(freqPeak) <= 0) { alert('峰值调用频次必须大于0'); return; }
            const list = getBasketList();
            list[currentEditIndex].freqAvg = freqAvg;
            list[currentEditIndex].freqPeak = freqPeak;
            saveBasketList(list);
            closeEditApi();
            renderBasket();
            showToast('编辑成功');
        }

        function openUploadAttachment(idx) {
            const list = getBasketList();
            const item = list[idx];
            if (!item) return;
            currentUploadIndex = idx;
            tempUploadFiles = [...(item.attachmentList || [])];
            document.getElementById('upload-service-name').textContent = item.serviceName;
            renderUploadFileList();
            document.getElementById('upload-attachment-modal').classList.remove('hidden');
        }
        function closeUploadAttachment() {
            document.getElementById('upload-attachment-modal').classList.add('hidden');
            currentUploadIndex = -1;
            tempUploadFiles = [];
            document.getElementById('file-input').value = '';
        }
        // 下载附件上传模板（Excel 格式）
        function downloadTemplate() {
            const tableHtml = [
                '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">',
                '<head><meta charset="UTF-8"></head>',
                '<body>',
                '<table border="1">',
                '<tr style="background-color:#1c7ffd;color:#fff;font-weight:bold;text-align:center;">',
                '    <th>序号</th><th>附件名称</th><th>附件类型</th><th>上传人</th><th>所属数据</th><th>说明</th>',
                '</tr>',
                '<tr><td>1</td><td>示例：数据使用申请表.docx</td><td>Word文档</td><td>张三</td><td>示例数据资源</td><td>请按此格式填写</td></tr>',
                '<tr><td>2</td><td>示例：数据授权书.pdf</td><td>PDF文档</td><td>张三</td><td>示例数据资源</td><td>请按此格式填写</td></tr>',
                '<tr><td>3</td><td>示例：数据清单.xlsx</td><td>Excel表格</td><td>张三</td><td>示例数据资源</td><td>请按此格式填写</td></tr>',
                '</table>',
                '</body>',
                '</html>'
            ].join('');
            const blob = new Blob([tableHtml], { type: 'application/vnd.ms-excel;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '附件上传模板.xls';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('模板下载成功');
        }
    </script>
<script>
        function handleFileSelect(e) {
            const files = Array.from(e.target.files || []);
            files.forEach(f => {
                tempUploadFiles.push({ name: f.name, size: formatFileSize(f.size), time: formatNowTime() });
            });
            renderUploadFileList();
        }
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(2) + ' MB';
        }
        function formatNowTime() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        function renderUploadFileList() {
            const box = document.getElementById('upload-file-list');
            document.getElementById('upload-count-tip').textContent = `已上传 ${tempUploadFiles.length} 个附件`;
            if (tempUploadFiles.length === 0) { box.innerHTML = ''; return; }
            box.innerHTML = tempUploadFiles.map((f, i) => `
                <div class="flex items-center justify-between bg-gray-50 rounded-lg px-3 py-2.5">
                    <div class="flex items-center gap-2 min-w-0">
                        <div class="w-8 h-8 rounded bg-white flex items-center justify-center shrink-0">
                            <i class="fa-regular fa-file-lines text-[#1c7ffd]"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="text-sm text-[#303133] truncate">${f.name}</div>
                            <div class="text-xs text-[#909399]">${f.size} · ${f.time}</div>
                        </div>
                    </div>
                    <button onclick="removeTempFile(${i})" class="w-7 h-7 rounded hover:bg-red-50 text-[#909399] hover:text-red-500 flex items-center justify-center shrink-0 transition-colors">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `).join('');
        }
        function removeTempFile(i) {
            tempUploadFiles.splice(i, 1);
            renderUploadFileList();
        }
        function confirmUploadAttachment() {
            const list = getBasketList();
            list[currentUploadIndex].attachmentList = [...tempUploadFiles];
            list[currentUploadIndex].attachmentStatus = tempUploadFiles.length > 0 ? '已上传' : '未上传';
            saveBasketList(list);
            closeUploadAttachment();
            renderBasket();
            showToast('附件上传成功');
        }

        function showToast(msg) {
            const t = document.getElementById('toast-success');
            document.getElementById('toast-msg').textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderBasket();
            renderCustomServices();
            updateFloatBasketBadge();
        });
    </script>
