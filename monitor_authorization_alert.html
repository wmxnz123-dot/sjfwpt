<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据服务平台 - 授权提醒</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-[#f0f2f5] text-[14px] text-gray-700">
    <header class="h-14 bg-[#1c7ffd] flex justify-between items-center px-6 text-white shrink-0 shadow-sm z-10">
        <div class="flex items-center gap-2 cursor-pointer hover:text-gray-200 transition-colors" onclick="window.location.href='index.html'">
            <i class="fa-solid fa-cubes-stacked text-2xl"></i>
            <span class="text-lg font-medium tracking-wider ml-1">数据服务平台</span>
        </div>
        <div class="flex items-center gap-6">
            <div class="relative cursor-pointer hover:text-gray-200 transition-colors" onclick="window.location.href='my_messages.html'">
                <i class="fa-regular fa-bell text-xl"></i>
                <span class="absolute -top-1.5 -right-2 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border border-[#1c7ffd] leading-none">20</span>
            </div>
            <div class="flex items-center gap-2 cursor-pointer hover:text-gray-200 transition-colors">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=yiyun&backgroundColor=b6e3f4" alt="avatar" class="w-8 h-8 rounded-full border border-blue-300 bg-white">
                <span>yiyun</span>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <aside class="w-[220px] bg-white border-r border-gray-200 shrink-0 overflow-y-auto">
            <div id="developer-side-nav" class="py-4"></div>
        </aside>

        <script src="./developer_nav.js"></script>

        <main class="flex-1 flex flex-col overflow-hidden relative bg-[#f0f2f5]">
            <div id="developer-top-nav" class="h-[52px] bg-white border-b border-gray-200 px-6 flex items-center gap-2 shrink-0 overflow-x-auto"></div>

            <div class="h-[52px] flex items-center px-6 text-[#606266] shrink-0 bg-white border-b border-gray-100 text-[14px]">
                <span>监控中心</span>
                <span class="mx-2">/</span>
                <span>服务使用告警</span>
                <span class="mx-2">/</span>
                <span class="font-medium text-[#303133]">授权提醒</span>
            </div>

            <div class="flex-1 p-6 flex flex-col gap-5 overflow-y-auto">
                <!-- 标签页 -->
                <div class="flex border-b border-gray-200 bg-white px-6 pt-2 rounded-t-lg">
                    <div id="tab-unread" class="pb-3 px-4 text-[#1c7ffd] border-b-2 border-[#1c7ffd] font-medium cursor-pointer text-[14px]" onclick="switchTab('unread')">未读提醒</div>
                    <div id="tab-read" class="pb-3 px-4 text-[#606266] hover:text-[#1c7ffd] cursor-pointer transition-colors text-[14px]" onclick="switchTab('read')">已读提醒</div>
                </div>

                <!-- 搜索区 -->
                <div class="bg-white rounded-lg shadow-[0_2px_12px_0_rgba(0,0,0,0.05)] p-6 shrink-0">
                    <div class="flex items-center gap-6 flex-wrap">
                        <div class="flex items-center gap-2">
                            <label class="text-[#606266] font-medium">场景名称：</label>
                            <input type="text" id="search-scene" placeholder="请输入" class="w-[200px] h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all">
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="text-[#606266] font-medium">目录名称：</label>
                            <input type="text" id="search-catalog" placeholder="请输入" class="w-[200px] h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all">
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="text-[#606266] font-medium">服务类型：</label>
                            <select id="search-type" class="w-[160px] h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all bg-white">
                                <option value="">全部</option>
                                <option value="库表">库表</option>
                                <option value="接口">接口</option>
                            </select>
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="text-[#606266] font-medium">使用单位：</label>
                            <input type="text" id="search-dept" placeholder="请输入" class="w-[180px] h-[36px] px-3 border border-gray-200 rounded-md text-sm outline-none focus:border-[#1c7ffd] focus:ring-1 focus:ring-[#1c7ffd] transition-all">
                        </div>
                        <div class="flex items-center gap-3 ml-auto">
                            <button onclick="resetSearch()" class="px-4 py-2 border border-gray-200 text-[#606266] rounded-md text-sm hover:bg-gray-50 transition-colors flex items-center gap-1">
                                <i class="fa-solid fa-rotate-right text-xs"></i>
                                重置
                            </button>
                            <button onclick="searchData()" class="px-4 py-2 bg-[#1c7ffd] text-white rounded-md text-sm hover:bg-[#1a73e8] transition-colors flex items-center gap-1">
                                <i class="fa-solid fa-search text-xs"></i>
                                查询
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 列表 -->
                <div id="alert-list" class="bg-white rounded-lg shadow-[0_2px_12px_0_rgba(0,0,0,0.05)]">
                    <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
                        <h2 class="text-[16px] font-bold text-[#303133]" id="list-title">授权提醒列表</h2>
                        <div class="flex items-center gap-2">
                            <button class="w-8 h-8 flex items-center justify-center text-[#909399] hover:text-[#1c7ffd] hover:bg-blue-50 rounded-md transition-colors" title="刷新" onclick="refreshList()">
                                <i class="fa-solid fa-rotate-right text-sm"></i>
                            </button>
                            <button class="w-8 h-8 flex items-center justify-center text-[#909399] hover:text-[#1c7ffd] hover:bg-blue-50 rounded-md transition-colors" title="导出">
                                <i class="fa-solid fa-download text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="bg-gray-50">
                                    <th class="px-5 py-3 text-center font-medium text-[#606266]">
                                        <input type="checkbox" class="w-3.5 h-3.5 text-[#1c7ffd] border-gray-300 rounded focus:ring-[#1c7ffd] cursor-pointer" id="select-all">
                                    </th>
                                    <th class="px-5 py-3 text-left font-medium text-[#606266]">场景名称</th>
                                    <th class="px-5 py-3 text-left font-medium text-[#606266]">目录名称</th>
                                    <th class="px-5 py-3 text-left font-medium text-[#606266]">服务名称</th>
                                    <th class="px-5 py-3 text-center font-medium text-[#606266]">服务类型</th>
                                    <th class="px-5 py-3 text-left font-medium text-[#606266]">使用单位</th>
                                    <th class="px-5 py-3 text-left font-medium text-[#606266]">所属单位</th>
                                    <th class="px-5 py-3 text-left font-medium text-[#606266]">提醒内容</th>
                                    <th class="px-5 py-3 text-left font-medium text-[#606266]">提醒时间</th>
                                    <th class="px-5 py-3 text-center font-medium text-[#606266]">操作</th>
                                </tr>
                            </thead>
                            <tbody id="table-body"></tbody>
                        </table>
                    </div>

                    <div class="px-5 py-4 border-t border-gray-100 flex items-center justify-between">
                        <div class="text-sm text-[#606266]">
                            共 <span class="font-medium" id="total-count">0</span> 条
                        </div>
                        <div class="flex items-center gap-2">
                            <button class="w-8 h-8 flex items-center justify-center border border-gray-200 rounded text-[#606266] hover:bg-gray-50 hover:text-[#1c7ffd] transition-colors">
                                <i class="fa-solid fa-angle-left text-sm"></i>
                            </button>
                            <button class="w-8 h-8 flex items-center justify-center border border-[#1c7ffd] bg-[#1c7ffd] text-white rounded">1</button>
                            <button class="w-8 h-8 flex items-center justify-center border border-gray-200 rounded text-[#606266] hover:bg-gray-50 hover:text-[#1c7ffd] transition-colors">
                                <i class="fa-solid fa-angle-right text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const unreadData = [
            { scene: '政务协同场景', catalog: '人口基础信息库', service: '人口基本信息查询接口', type: '接口', dept: '市民政局', owner: '市公安局', days: 15, time: '2026-08-20 09:30' },
            { scene: '营商环境场景', catalog: '企业法人信息库', service: '企业法人基本信息库表', type: '库表', dept: '市市场监管局', owner: '市市场监管局', days: 30, time: '2026-08-20 08:15' },
            { scene: '医疗健康场景', catalog: '医疗服务信息库', service: '医疗机构名录数据接口', type: '接口', dept: '市卫健委', owner: '市卫健委', days: 45, time: '2026-08-19 17:42' },
            { scene: '教育服务场景', catalog: '教育基础信息库', service: '学校基本信息库表', type: '库表', dept: '市教育局', owner: '市教育局', days: 20, time: '2026-08-19 14:20' },
            { scene: '社会保障场景', catalog: '社保信息库', service: '社保参保信息查询接口', type: '接口', dept: '市人社局', owner: '市人社局', days: 60, time: '2026-08-18 10:05' }
        ];

        const readData = [
            { scene: '交通出行场景', catalog: '道路信息库', service: '道路基础信息库表', type: '库表', dept: '市交通局', owner: '市交通局', days: 25, time: '2026-08-15 11:30' },
            { scene: '环境监测场景', catalog: '环境质量监测库', service: '空气质量监测接口', type: '接口', dept: '市生态环境局', owner: '市生态环境局', days: 35, time: '2026-08-12 16:45' },
            { scene: '文化旅游场景', catalog: '文化资源信息库', service: '文物保护单位库表', type: '库表', dept: '市文旅局', owner: '市文旅局', days: 18, time: '2026-08-10 09:00' }
        ];

        let currentTab = 'unread';
        let filteredData = null;

        function getAlertContent(item) {
            if (item.type === '库表') {
                return `库表数据已申请${item.days}天`;
            } else {
                return `接口数据已${item.days}天未使用`;
            }
        }

        function getTypeTag(type) {
            if (type === '库表') {
                return '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs bg-blue-50 text-blue-600 border border-blue-100">库表</span>';
            }
            return '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs bg-green-50 text-green-600 border border-green-100">接口</span>';
        }

        function getDisplayData() {
            const data = currentTab === 'unread' ? unreadData : readData;
            if (filteredData) return filteredData;
            return data;
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const data = getDisplayData();
            const title = currentTab === 'unread' ? '未读提醒列表' : '已读提醒列表';

            document.getElementById('list-title').textContent = title;
            document.getElementById('total-count').textContent = data.length;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="py-16 text-center text-gray-400">暂无数据</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((item) => {
                const realIndex = (currentTab === 'unread' ? unreadData : readData).indexOf(item);
                const typeTag = getTypeTag(item.type);
                const alertContent = getAlertContent(item);
                const operation = currentTab === 'unread'
                    ? `<a href="javascript:void(0)" class="text-[#1c7ffd] hover:text-[#1a73e8] text-sm" onclick="markAsRead(${realIndex})">标记已读</a>`
                    : `<a href="javascript:void(0)" class="text-[#f56c6c] hover:text-[#d84f4f] text-sm" onclick="deleteItem(${realIndex})">删除</a>`;

                return `
                    <tr class="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                        <td class="px-5 py-4 text-center"><input type="checkbox" class="row-check w-3.5 h-3.5 text-[#1c7ffd] border-gray-300 rounded focus:ring-[#1c7ffd] cursor-pointer"></td>
                        <td class="px-5 py-4 text-[#303133]">${item.scene}</td>
                        <td class="px-5 py-4 text-[#303133]">${item.catalog}</td>
                        <td class="px-5 py-4 text-[#303133]">${item.service}</td>
                        <td class="px-5 py-4 text-center">${typeTag}</td>
                        <td class="px-5 py-4 text-[#606266]">${item.dept}</td>
                        <td class="px-5 py-4 text-[#606266]">${item.owner}</td>
                        <td class="px-5 py-4 text-[#606266]">${alertContent}</td>
                        <td class="px-5 py-4 text-[#606266] whitespace-nowrap">${item.time}</td>
                        <td class="px-5 py-4 text-center">${operation}</td>
                    </tr>
                `;
            }).join('');
        }

        function switchTab(tab) {
            currentTab = tab;
            filteredData = null;
            const tabUnread = document.getElementById('tab-unread');
            const tabRead = document.getElementById('tab-read');

            if (tab === 'unread') {
                tabUnread.classList.add('text-[#1c7ffd]', 'font-medium', 'border-b-2', 'border-[#1c7ffd]');
                tabUnread.classList.remove('text-[#606266]');
                tabRead.classList.remove('text-[#1c7ffd]', 'font-medium', 'border-b-2', 'border-[#1c7ffd]');
                tabRead.classList.add('text-[#606266]');
            } else {
                tabRead.classList.add('text-[#1c7ffd]', 'font-medium', 'border-b-2', 'border-[#1c7ffd]');
                tabRead.classList.remove('text-[#606266]');
                tabUnread.classList.remove('text-[#1c7ffd]', 'font-medium', 'border-b-2', 'border-[#1c7ffd]');
                tabUnread.classList.add('text-[#606266]');
            }
            renderTable();
        }

        function searchData() {
            const scene = document.getElementById('search-scene').value.trim().toLowerCase();
            const catalog = document.getElementById('search-catalog').value.trim().toLowerCase();
            const type = document.getElementById('search-type').value;
            const dept = document.getElementById('search-dept').value.trim().toLowerCase();

            const sourceData = currentTab === 'unread' ? unreadData : readData;

            filteredData = sourceData.filter(item => {
                if (scene && !item.scene.toLowerCase().includes(scene)) return false;
                if (catalog && !item.catalog.toLowerCase().includes(catalog)) return false;
                if (type && item.type !== type) return false;
                if (dept && !item.dept.toLowerCase().includes(dept)) return false;
                return true;
            });

            renderTable();
        }

        function resetSearch() {
            document.getElementById('search-scene').value = '';
            document.getElementById('search-catalog').value = '';
            document.getElementById('search-type').value = '';
            document.getElementById('search-dept').value = '';
            filteredData = null;
            renderTable();
        }

        function markAsRead(index) {
            const item = unreadData.splice(index, 1)[0];
            readData.unshift(item);
            filteredData = null;
            renderTable();
        }

        function deleteItem(index) {
            readData.splice(index, 1);
            filteredData = null;
            renderTable();
        }

        function refreshList() {
            filteredData = null;
            renderTable();
        }

        document.getElementById('select-all').addEventListener('change', function() {
            document.querySelectorAll('.row-check').forEach(cb => cb.checked = this.checked);
        });

        renderTable();
    </script>
</body>
</html>
