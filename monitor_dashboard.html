    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const callTrendCanvas = document.getElementById('callTrendChart');
            if (callTrendCanvas) {
                const callTrendCtx = callTrendCanvas.getContext('2d');
                new Chart(callTrendCtx, {
                    type: 'line',
                    data: {
                        labels: ['7/21', '7/22', '7/23', '7/24', '7/25', '7/26', '7/27'],
                        datasets: [{
                            label: '调用量(万)',
                            data: [98, 105, 112, 108, 115, 110, 125.6],
                            borderColor: '#1c7ffd',
                            backgroundColor: 'rgba(28, 127, 253, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointBackgroundColor: '#1c7ffd'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: false, grid: { color: '#f3f4f6' } },
                            x: { grid: { display: false } }
                        }
                    }
                });
            }

            const alertTrendCanvas = document.getElementById('alertTrendChart');
            if (alertTrendCanvas) {
                const alertTrendCtx = alertTrendCanvas.getContext('2d');
                new Chart(alertTrendCtx, {
                    type: 'line',
                    data: {
                        labels: ['7/21', '7/22', '7/23', '7/24', '7/25', '7/26', '7/27'],
                        datasets: [{
                            label: '告警数量',
                            data: [5, 8, 3, 12, 7, 15, 10],
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointBackgroundColor: '#ef4444'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: '#f3f4f6' } },
                            x: { grid: { display: false } }
                        }
                    }
                });
            }

            const topCallsCanvas = document.getElementById('topCallsChart');
            if (topCallsCanvas) {
                const topCallsCtx = topCallsCanvas.getContext('2d');
                new Chart(topCallsCtx, {
                    type: 'bar',
                    data: {
                        labels: ['人口数据服务', '企业工商登记', '婚姻状态查询', '健康医疗数据', '电子证照验证'],

                            label: '调用次数(万次)',
                            data: [12.5, 9.8, 8.5, 6.2, 5.1],
                            backgroundColor: '#1c7ffd',
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: '#f3f4f6' } },
                            x: { grid: { display: false } }
                        }
                    }
                });
            }

            const topAlertSceneCanvas = document.getElementById('topAlertSceneChart');
            if (topAlertSceneCanvas) {
                const topAlertSceneCtx = topAlertSceneCanvas.getContext('2d');
                new Chart(topAlertSceneCtx, {
                    type: 'bar',
                    data: {
                        labels: ['科技项目审批接口', '健康医疗数据接口', '财政资金查询接口', '企业工商登记接口', '人口数据服务接口'],

                            borderRadius: 4
                        }]

                        responsive: true,
                        maintainAspectRatio: false,

                            y: { beginAtZero: true, grid: { color: '#f3f4f6' } },

                });
