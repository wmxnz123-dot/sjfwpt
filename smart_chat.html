                <div class="flex-1 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col overflow-hidden">
                    <div class="h-14 border-b border-gray-100 flex items-center justify-between px-6 shrink-0">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full gradient-bg flex items-center justify-center">

                                        <div class="flex items-start gap-2">

                                        <div class="flex items-start gap-2">

    <script>PortalCommon.renderFloatButtons();</script>

    <script>
        let basketCount = 1;
        let customizing = false;
        let lastRecommendServices = [];

        function startNewChat() {
            const welcome = document.getElementById('chat-welcome');
            if (welcome) welcome.classList.remove('hidden');
            const container = document.getElementById('chat-messages');
            const messages = container.querySelectorAll('.flex.items-start.gap-3');
            messages.forEach(msg => {
                if (!msg.closest('#chat-welcome')) msg.remove();
            });
            document.getElementById('chat-input').value = '';
            document.getElementById('chat-input').style.height = 'auto';
        }

        function hideWelcome() {
            const welcome = document.getElementById('chat-welcome');
            if (welcome) welcome.classList.add('hidden');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 128) + 'px';
        }

        function sendQuickQuestion(btn) {
            const text = btn.querySelector('p:first-child')?.textContent?.trim() || btn.textContent.trim();
            hideWelcome();
            addUserMessage(text);
            simulateReply(text);
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            hideWelcome();
            addUserMessage(text);
            input.value = '';
            input.style.height = 'auto';
            simulateReply(text);
        }

        function handleChatKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function addUserMessage(text) {
            const container = document.getElementById('chat-messages');
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            const html = `
                <div class="flex items-start gap-3 justify-end">
                    <div class="max-w-[70%]">
                        <div class="bg-[#1c7ffd] text-white rounded-2xl rounded-tr-sm px-4 py-3 text-sm leading-relaxed">
                            ${escapeHtml(text)}
                        </div>
                        <div class="text-xs text-[#909399] mt-1 mr-1 text-right">${time}</div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-user text-gray-500 text-xs"></i>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        function simulateReply(userText) {
            const container = document.getElementById('chat-messages');
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            const loadingHtml = `
                <div class="flex items-start gap-3" id="ai-loading">
                    <div class="w-8 h-8 rounded-full gradient-bg flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-robot text-white text-xs"></i>
                    </div>
                    <div class="bg-gray-100 rounded-2xl rounded-tl-sm px-4 py-3">
                        <span class="inline-block w-1 h-1 bg-[#909399] rounded-full animate-bounce"></span>
                        <span class="inline-block w-1 h-1 bg-[#909399] rounded-full animate-bounce mx-0.5" style="animation-delay: 0.15s"></span>
                        <span class="inline-block w-1 h-1 bg-[#909399] rounded-full animate-bounce" style="animation-delay: 0.3s"></span>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', loadingHtml);
            scrollToBottom();

            setTimeout(() => {
                document.getElementById('ai-loading').remove();
                const replyText = generateReply(userText);
                if (!replyText) {
                    scrollToBottom();
                    return;
                }
                const replyHtml = `
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 rounded-full gradient-bg flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-robot text-white text-xs"></i>
                        </div>
                        <div class="max-w-[70%]">
                            <div class="bg-gray-100 rounded-2xl rounded-tl-sm px-4 py-3 text-sm text-[#303133] leading-relaxed">
                                ${replyText}
                            </div>
                            <div class="text-xs text-[#909399] mt-1 ml-1">${time}</div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', replyHtml);
                scrollToBottom();
            }, 1000);
        }

        function generateReply(text) {
            if (customizing) {
                customizing = false;
                addCustomToBasket(text);
                return '';
            }

            if (text.includes('定制') || text.includes('我的需求')) {
                customizing = true;
                return '好的，请告诉我您的具体数据需求，包括需要什么类型的数据、使用场景、数据字段等信息，我会将您的定制需求加入数据篮。';
            }

            if (text.includes('政策') || text.includes('法规') || text.includes('我要问')) {
                return `关于数据服务平台相关政策，主要包括以下几个方面：<br><br>
                    <strong>一、数据共享政策</strong><br>
                    • 《数据安全法》《个人信息保护法》相关规定<br>
                    • 公共数据共享开放管理办法<br>
                    • 数据分类分级保护制度<br><br>
                    <strong>二、数据使用政策</strong><br>
                    • 数据申请需遵循"最小够用"原则<br>
                    • 敏感数据需签署保密协议<br>
                    • 数据使用用途不得超出申请范围<br><br>
                    <strong>三、数据安全政策</strong><br>
                    • 数据传输与存储加密要求<br>
                    • 数据访问审计与追踪<br>
                    • 数据泄露应急处置流程<br><br>
                    <strong>四、合规要求</strong><br>
                    • 个人信息保护要求<br>
                    • 数据跨境传输规定<br>
                    • 数据主体权利保障<br><br>
                    您想了解哪方面的具体政策内容？我可以为您提供更详细的解读。`;
            }

            if (text.includes('加入数据篮') || text.includes('加进去') || text.includes('添加到数据篮')) {
                if (lastRecommendServices.length > 0) {
                    const serviceName = lastRecommendServices[0];
                    lastRecommendServices = [];
                    addToBasket(serviceName, serviceName);
                    return '';
                }
                const serviceName = extractServiceName(text);
                if (serviceName) {
                    addToBasket(serviceName, serviceName);
                    return '';
                }
                return '请问您想把哪个数据服务加入数据篮呢？您可以直接告诉我服务名称。';
            }

            if (text.includes('没找到') || text.includes('找不到') || text.includes('没有相关数据')) {
                return '很抱歉没有找到您需要的数据资源。<br><br>不过别担心，我们支持<strong>数据定制服务</strong>！<br><br>您可以告诉我具体的数据需求，我们会：<br>• 评估数据可行性<br>• 协调数据提供方<br>• 定制数据接口或数据包<br><br>请问您需要什么类型的数据呢？';
            }

            if (text.includes('新能源汽车') || text.includes('汽车')) {
                lastRecommendServices = ['新能源汽车产业数据接口', '充电基础设施数据接口'];
                return `根据您的需求，为您推荐以下新能源汽车相关数据资源：<br><br>
                    <strong>1. ${dataLink('新能源汽车产业数据', 'business')}</strong><br>
                    • 提供方：市工业和信息化局<br>
                    • 数据内容：新能源汽车产量、销量、保有量等产业数据<br>
                    • 更新频率：月度更新<br><br>
                    <strong>2. ${dataLink('充电基础设施数据', 'district')}</strong><br>
                    • 提供方：市发展改革委<br>
                    • 数据内容：充电桩分布、充电量、运营状态等数据<br>
                    • 更新频率：实时更新<br><br>
                    <strong>3. ${dataLink('机动车保有量数据', 'population')}</strong><br>
                    • 提供方：市公安局交通管理局<br>
                    • 数据内容：机动车注册登记、转移登记等数据<br>
                    • 更新频率：月度更新<br><br>
                    您需要我把这些数据服务加入数据篮吗？`;
            }
            if (text.includes('企业纳税') || text.includes('纳税数据') || text.includes('是谁的')) {
                return `企业纳税数据的相关说明：<br><br>
                    <strong>数据提供方</strong>：国家税务总局某市税务局<br><br>
                    <strong>数据内容</strong>：<br>
                    • 企业纳税基本信息<br>
                    • 各税种缴纳情况<br>
                    • 纳税信用等级<br>
                    • 欠税信息等<br><br>
                    <strong>数据分类</strong>：<br>
                    • 公共数据：纳税信用A级企业名单、欠税公告等可公开信息<br>
                    • 受限数据：企业具体纳税明细（需授权申请）<br><br>
                    <strong>注意事项</strong>：<br>
                    企业纳税明细数据属于敏感数据，申请使用需符合相关法律法规要求，并取得数据主体授权。`;
            }
            if (text.includes('数字经济') && text.includes('分析')) {
                lastRecommendServices = ['数字经济核心产业数据接口', '数字产业企业名录接口'];
                return `做数字经济分析建议关注以下几类数据：<br><br>
                    <strong>一、产业基础数据</strong><br>
                    • ${dataLink('数字产业企业名录', 'business')}（工信部门）<br>
                    • 软件和信息技术服务业数据<br>
                    • 互联网行业发展数据<br><br>
                    <strong>二、经济运行数据</strong><br>
                    • 数字经济核心产业增加值（统计部门）<br>
                    • 数字产品进出口贸易数据<br>
                    • 数字产业投资数据<br><br>
                    <strong>三、创新能力数据</strong><br>
                    • 数字经济领域专利数据（知识产权局）<br>
                    • 软件著作权登记数据<br>
                    • ${dataLink('高新技术企业认定数据', 'business')}<br><br>
                    <strong>四、基础设施数据</strong><br>
                    • 5G基站建设数据<br>
                    • 数据中心布局数据<br>
                    • 宽带网络覆盖数据<br><br>
                    需要我帮您把推荐的数据服务加入数据篮吗？`;
            }
            if (text.includes('申请') && text.includes('数据')) {
                return `申请数据资源的详细流程如下：<br><br>
                    <strong>第一步：查找数据</strong><br>
                    在数据中心浏览或搜索您需要的数据资源<br><br>
                    <strong>第二步：提交申请</strong><br>
                    1. 进入数据详情页，点击"申请使用"<br>
                    2. 填写申请信息（用途说明、使用场景等）<br>
                    3. 上传相关证明材料<br>
                    4. 提交申请<br><br>
                    <strong>第三步：审核流程</strong><br>
                    1. 平台初审（1个工作日）<br>
                    2. 数据提供方审核（1-3个工作日）<br>
                    3. 审核结果通知<br><br>
                    <strong>第四步：使用数据</strong><br>
                    审核通过后，您可以：<br>
                    • 通过API接口调用数据<br>
                    • 下载数据包（如适用）<br>
                    • 在数据沙箱中使用数据<br><br>
                    您有想申请的具体数据吗？我可以帮您找到。`;
            }
            if (text.includes('婚姻') || (text.includes('应用') && text.includes('数据'))) {
                lastRecommendServices = ['人口基本信息查询接口', '婚姻登记信息查询接口'];
